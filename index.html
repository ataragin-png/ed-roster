<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקשות משמרות לרפואה דחופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#16222B; --muted:#5A6770;
  --line:#CFD7D5; --line2:#E2E7E5; --primary:#1C4E79; --primary-ink:#FFFFFF;
  --danger:#B3261E; --danger-bg:#FBE6E4; --ok-bg:#DCF1E1; --warn:#9A5800; --warn-bg:#FFF0D6; --ok:#2C6A3E;
  --wk:#E3EAF1; --eve:#EFEBDD; --hol:#F4E4C2; --vac:#DDE3E1;
  --radius-s:4px; --radius-m:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171C; --surface:#172127; --surface2:#1C2830; --ink:#E4EAED; --muted:#98A6AE;
    --line:#2D3B43; --line2:#233139; --primary:#86B6E2; --primary-ink:#0A1824;
    --danger:#FF8C82; --danger-bg:#3B1C1A; --ok-bg:#163421; --warn:#F0B45C; --warn-bg:#33270F; --ok:#8FD0A0;
    --wk:#1B2631; --eve:#23241A; --hol:#2E2614; --vac:#253238; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171C; --surface:#172127; --surface2:#1C2830; --ink:#E4EAED; --muted:#98A6AE;
  --line:#2D3B43; --line2:#233139; --primary:#86B6E2; --primary-ink:#0A1824;
  --danger:#FF8C82; --danger-bg:#3B1C1A; --ok-bg:#163421; --warn:#F0B45C; --warn-bg:#33270F; --ok:#8FD0A0;
  --wk:#1B2631; --eve:#23241A; --hol:#2E2614; --vac:#253238; color-scheme: dark;
}
/* shift colours */
.c-amber{--cb:#FBE8BC;--cf:#5E3F00}.c-indigo{--cb:#DCDDF6;--cf:#262A7A}.c-blue{--cb:#D8E7F7;--cf:#173F66}
.c-teal{--cb:#D2ECE6;--cf:#0C4D40}.c-olive{--cb:#E6EACB;--cf:#434A10}.c-rose{--cb:#F7DCE3;--cf:#6E1F36}
.c-violet{--cb:#E9DDF5;--cf:#4A2472}.c-crimson{--cb:#F6D4D0;--cf:#7A1A12}.c-slate{--cb:#E1E5E8;--cf:#33414B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-amber{--cb:#4A3A12;--cf:#FBE3A6}:root:not([data-theme="light"]) .c-indigo{--cb:#2B2E5E;--cf:#CFD1FA}:root:not([data-theme="light"]) .c-blue{--cb:#1D3650;--cf:#C9DFF6}:root:not([data-theme="light"]) .c-teal{--cb:#15413A;--cf:#BDE9DE}:root:not([data-theme="light"]) .c-olive{--cb:#383C16;--cf:#E1E6B5}:root:not([data-theme="light"]) .c-rose{--cb:#4D2230;--cf:#F6CCD8}:root:not([data-theme="light"]) .c-violet{--cb:#3A2654;--cf:#E3D0F7}:root:not([data-theme="light"]) .c-crimson{--cb:#521F1A;--cf:#F8C8C1}:root:not([data-theme="light"]) .c-slate{--cb:#2C363D;--cf:#D6DDE2}}
:root[data-theme="dark"] .c-amber{--cb:#4A3A12;--cf:#FBE3A6}:root[data-theme="dark"] .c-indigo{--cb:#2B2E5E;--cf:#CFD1FA}:root[data-theme="dark"] .c-blue{--cb:#1D3650;--cf:#C9DFF6}:root[data-theme="dark"] .c-teal{--cb:#15413A;--cf:#BDE9DE}:root[data-theme="dark"] .c-olive{--cb:#383C16;--cf:#E1E6B5}:root[data-theme="dark"] .c-rose{--cb:#4D2230;--cf:#F6CCD8}:root[data-theme="dark"] .c-violet{--cb:#3A2654;--cf:#E3D0F7}:root[data-theme="dark"] .c-crimson{--cb:#521F1A;--cf:#F8C8C1}:root[data-theme="dark"] .c-slate{--cb:#2C363D;--cf:#D6DDE2}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 10px;max-width:100%}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav select{font-size:16px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:6px 10px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 12px;font-weight:500;min-height:36px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:3px 9px;min-height:28px;font-size:13px}

nav.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
main{padding:14px 20px 40px}

.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pill.mid{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.good{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12.5px;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}

/* grid */
.gridwrap{overflow:auto;max-height:calc(100vh - 230px);min-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px}
.grid th,.grid td{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:0;text-align:center;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:600}
.grid thead tr:nth-child(2) th{top:26px}
.grid thead tr:first-child th{height:26px}
.grid thead tr:nth-child(2) th{height:22px;color:var(--muted);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--line)}
.grid .namecol{position:sticky;right:0;z-index:2;background:var(--surface);text-align:right;padding:0 10px;min-width:118px;max-width:150px;border-left:1px solid var(--line)}
.grid thead .namecol{z-index:4}
.grid .namecol button{border:0;background:none;padding:6px 0;text-align:right;width:100%;font-weight:600}
.grid .namecol small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:-4px;padding-bottom:4px;overflow:hidden;text-overflow:ellipsis}
.grid .stat{min-width:44px;padding:0 4px;font-variant-numeric:tabular-nums;font-weight:600}
.sig{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:10px;text-align:center;font-weight:700;vertical-align:1px}
.stat.under{color:var(--muted)}.stat.hi{color:var(--warn)}.stat.lo{color:var(--primary)}.stat.over{color:var(--danger)}.stat.done{color:var(--ok)}.stat.na{color:var(--muted);font-weight:400}
.grid th.day{min-width:42px;cursor:pointer}
.grid th.day:hover{background:var(--surface2)}
.grid .wk{background:var(--wk)}
.grid .eve{background:var(--eve)}
.grid .hol{background:var(--hol)}
.grid thead th.wk,.grid thead th.eve,.grid thead th.hol{background-clip:padding-box}
.grid tr.grp td{background:var(--surface2);text-align:right;font-weight:700;padding:6px 10px;color:var(--muted);font-size:12px}
.cell{width:42px;height:34px;min-width:42px;border:0;background:none;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
td.cellwrap{position:relative}
.cell:hover{background:rgba(28,78,121,.07)}
.chip{display:inline-block;background:var(--cb);color:var(--cf);border-radius:var(--radius-s);padding:0 3px;font-size:11px;font-weight:600;line-height:15px;max-width:40px;overflow:hidden}
.mk-vac{background:repeating-linear-gradient(135deg,var(--vac) 0 4px,transparent 4px 8px)}
.mk-off::after{content:"";position:absolute;inset:9px 12px;border-top:2px solid var(--muted);transform:rotate(-35deg);opacity:.55;pointer-events:none}
.mk-soft .cell::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mk-want .cell::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
td.err{box-shadow:inset 0 0 0 2px var(--danger)}
td.warn{box-shadow:inset 0 0 0 2px var(--warn)}
tr.cov td{height:26px;font-size:11.5px}
tr.cov td.namecol{font-weight:600;font-size:12px}
tr.covhead td{background:var(--surface2);font-weight:700;color:var(--muted);font-size:12px;text-align:right;padding:6px 10px;border-top:2px solid var(--line)}
.covbtn{border:0;background:none;width:42px;height:26px;padding:0 2px;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.covbtn.miss{background:var(--danger-bg);color:var(--danger);font-weight:700}
.covbtn.extra{color:var(--warn);font-weight:600}
.covbtn.none{color:var(--line)}

/* forms/tables in other tabs */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p.hint{margin:0 0 12px;color:var(--muted);font-size:13px;max-width:70ch}
.tablewrap{overflow-x:auto}
table.form{border-collapse:collapse;width:100%;font-size:13px}
table.form th{text-align:right;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.form td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
table.form input[type=text],table.form input[type=number],table.form input[type=time],table.form select,table.form textarea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 6px}
table.form input[type=number]{width:62px}
table.form input.w-name{width:110px}
table.form input.w-short{width:64px}
table.form textarea{width:100%;min-width:220px;min-height:34px;resize:vertical}
.wdbox{display:flex;gap:2px}
.wdbox label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.prefchips{display:flex;flex-wrap:wrap;gap:3px;max-width:330px}
.prefchips button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);font-size:11.5px;padding:1px 5px}
.prefchips button.pref{background:#D8F0DE;color:#1E5A2C;border-color:#9ED0AA}
.prefchips button.avoid{background:var(--danger-bg);color:var(--danger);border-color:transparent;text-decoration:line-through}
.kv{display:flex;flex-wrap:wrap;gap:16px}
.kv label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.kv input{width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 7px;font-size:15px;color:var(--ink)}

table.luach{border-collapse:collapse;font-size:13px;background:var(--surface)}
table.luach th,table.luach td{border:1px solid var(--line2);padding:5px 8px;text-align:right;white-space:nowrap}
table.luach thead th{position:sticky;top:0;background:var(--surface);z-index:1}
table.luach td.miss{background:var(--danger-bg);color:var(--danger);font-weight:600}

/* sheet dialog */
.overlay{position:fixed;inset:0;background:rgba(10,20,28,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:18px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet h3{margin:0;font-size:18px}
.sheet .sub{color:var(--muted);margin:2px 0 12px;font-size:13px}
.sheet h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:6px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:600}
.opt.dim{opacity:.55}
.opt .chip{max-width:none}
.note{background:var(--surface2);border-radius:var(--radius-m);padding:8px 10px;font-size:13px;white-space:pre-wrap}
.issues{margin:6px 0 0;padding:0 18px 0 0;font-size:13px}
.issues li.err{color:var(--danger)}.issues li.warn{color:var(--warn)}
.cands{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:var(--radius-m);overflow:hidden}
.cand{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line2)}
.cand:last-child{border-bottom:0}
.cand .who{font-weight:600;min-width:74px}
.cand .why{flex:1;color:var(--muted);font-size:12.5px}
.cand.blocked .who{color:var(--muted);font-weight:500}
.sheet .foot{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-m);font-weight:500;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.rules{background:var(--surface2);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:14px;font-size:13.5px;max-width:74ch}
.rules strong{display:block;margin-bottom:4px}
.rules ul{margin:0;padding-right:18px}.rules li{margin:2px 0}
.fields{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields input,.fields select,.req textarea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-m);padding:7px 9px;font-size:15px;color:var(--ink)}
.req textarea{width:100%;max-width:520px;min-height:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:8px 12px;font-weight:600;min-height:38px}
.seg button:last-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:520px;margin:10px 0 14px}
.cal .wdh{text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.cal button.d{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:15px;min-height:50px;padding:2px}
.cal button.d.wke{background:var(--wk)}
.cal button.d.hol{background:var(--hol)}
.cal button.d small{font-size:10.5px;font-weight:600;line-height:1.1}
.cal button.d.b{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.cal button.d.s{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cal button.d.w{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.errs{color:var(--danger);font-size:13px;font-weight:600;margin:4px 0}
table.form td.bad{color:var(--danger);font-weight:700}
table.form td.okc{color:var(--ok);font-weight:600}
.msgbox{width:100%;min-height:180px;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-m);padding:8px;white-space:pre-wrap;color:var(--ink)}
@media (max-width:640px){
  header.top{padding:14px 12px 8px}
  .toolbar{padding:0 12px 10px}
  nav.tabs{padding:0 8px}
  main{padding:12px 8px 40px}
  .brand h1{font-size:19px}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:14px 14px 0 0;max-height:88%;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .grid .namecol{min-width:92px}
  .gridwrap{max-height:calc(100vh - 260px)}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
@media print{.toolbar,nav.tabs,.status,.legend,.monthnav select{display:none}.gridwrap{max-height:none;overflow:visible;border:0}}
</style>
<style>
.cal button.d.vac{background:repeating-linear-gradient(135deg,var(--vac) 0 5px,var(--surface) 5px 10px);border-color:var(--muted)}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 48px}
.panel{margin-top:4px}
.done{background:var(--ok-bg);color:var(--ok);border-radius:var(--radius-m);padding:10px 12px;font-weight:600;margin-top:12px;font-size:13.5px}
</style>
</head>
<body>
<header class="top" style="max-width:620px;margin:0 auto">
  <div class="brand"><h1>בקשות משמרות</h1><p>רפואה דחופה</p></div>
</header>
<div class="wrap"><main id="main" style="padding:0"></main></div>
<div id="layer"></div>
<script>
const NAMES=["אברהם", "אוריה", "אחיה", "אליה", "אשר", "באסל", "בת שבע", "גנית", "דב", "דוד", "דנה", "ווד", "חיגאזי", "טבקמן", "יוני י", "יוסי", "מגד", "מיסק", "נועה", "סימא", "עוז", "עלי"];
const RULES={A:6,R:5,wkA:3,wkR:2};
const BASE={AS:11,AD:3,RD:6};
const HEB_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const WD=['א','ב','ג','ד','ה','ו','ש'];
const WANT={A:[['m','בוקר אגף א','בוקר'],['n','לילה אגף א','לילה'],['mc','בוקר מהלכים כירורגיה','כיר ב'],['nc','ערב מהלכים כירורגיה','כיר ע'],['v','תורנות צד ב','תור ב'],['p','תורנות צד ג (פנימית)','פנ׳'],['i','טיפול נמרץ','טנ״צ']],
  R:[['v','תורנות צד ב','תור ב'],['bv','בוקר + תורנות צד ב (סופ״ש)','ב+ת'],['p','תורנות צד ג (פנימית)','פנ׳'],['c','מהלכים פנימית (פנימית ב)','מהל פנ'],['i','טיפול נמרץ','טנ״צ'],['o','אורטופדיה','אורט'],['k','ילדים','ילד׳']]};
const ALLT=[['m','בוקר אגף א'],['n','לילה אגף א'],['b','בוקר צד ב'],['v','תורנות צד ב'],['bv','בוקר + תורנות צד ב (סופ״ש)'],['g','בוקר צד ג'],['p','תורנות צד ג (פנימית)'],['c','מהלכים פנימית (פנימית ב)'],['mc','בוקר מהלכים כירורגיה'],['nc','ערב מהלכים כירורגיה'],['i','טיפול נמרץ'],['k','ילדים'],['o','אורטופדיה']];
const TNAME={},TSHORT={};for(const g in WANT)for(const[c,n,sh]of WANT[g]){TNAME[c]=n;TSHORT[c]=sh}
for(const[c,n]of ALLT)TNAME[c]=TNAME[c]||n;

const _hc={};
function hol(key){if(_hc[key])return _hc[key];const out={},[y,m]=key.split('-').map(Number);
  try{const f=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long'});for(let d=1;d<=kDim(key);d++){const p=f.formatToParts(new Date(y,m-1,d));const hm=p.find(x=>x.type==='month')?.value,hd=Number(p.find(x=>x.type==='day')?.value);const h=HOLIDAYS[hm]&&HOLIDAYS[hm][hd];if(h)out[d]={t:h[0],name:h[1]}}}catch(e){}
  return(_hc[key]=out)}
function kDim(key){const[y,m]=key.split('-').map(Number);return new Date(y,m,0).getDate()}
function kWd(key,d){const[y,m]=key.split('-').map(Number);return new Date(y,m-1,d).getDay()}
function kWeekend(key,d){const w=kWd(key,d);return w===5||w===6||!!hol(key)[d]}

function monthOpts(){const n=new Date(),o=[];for(let i=0;i<3;i++){const dt=new Date(n.getFullYear(),n.getMonth()+i,1);o.push(`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}`)}return o}
const PART={'':'כל היום',day:'יום 09–21',night:'לילה 21–09',duty:'תורנות 16–08'};
function units(){const u=[];for(const[d,p]of RQ.b){u.push(d);if(RQ.g==='A'&&!p)u.push(d)}return u}
function blockLabel(p){return RQ.g==='A'&&p?(p==='day'?'חסום יום':p==='duty'?'חסום תורנות':'חסום לילה'):'חסום'}

function rulesFor(g){return g==='R'?{max:RULES.R,wk:RULES.wkR}:{max:RULES.A,wk:RULES.wkA}}
function checkBlocks(key,g,b){const ru=rulesFor(g),wk=b.filter(d=>kWeekend(key,d)).length,errs=[];
  if(b.length>ru.max)errs.push(`יותר מ־${ru.max} חסימות`);if(wk>ru.wk)errs.push(`יותר מ־${ru.wk} חסימות בסופ״ש או בחג`);
  if(b.length>=2&&wk===b.length)errs.push('לא כל החסימות יכולות להיות בסופ״ש');return{ru,wk,errs}}
function toast(msg,ms=2800){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),ms)}

RQ.b=new Map((RQ.b||[]).map(x=>Array.isArray(x)?x:[x,'']));if(!RQ.bpart)RQ.bpart='';RQ.s=new Set(RQ.s);RQ.w=new Map(RQ.w);RQ.vac=new Set(RQ.vac||[]);if(RQ.vby===undefined)RQ.vby='איתי';

function viewTabs(){return`<nav class="tabs" role="tablist" style="padding:0;margin-bottom:12px"><button role="tab" data-view="req" aria-selected="${VIEW==='req'}">בקשות לחודש הבא</button><button role="tab" data-view="chg" aria-selected="${VIEW==='chg'}">בקשת החלפה</button><button role="tab" data-view="cal" aria-selected="${VIEW==='cal'}">הלוח שלי</button></nav>`}
function dateSel(id,val,key){return`<select id="${id}"><option value="">תאריך</option>${[...Array(kDim(key))].map((_,i)=>i+1).map(d=>`<option value="${d}" ${String(val)===String(d)?'selected':''}>${d} (${WD[kWd(key,d)]})</option>`).join('')}</select>`}
function shiftSel(id,val){return`<select id="${id}"><option value="">משמרת</option>${ALLT.map(([c,n])=>`<option value="${c}" ${val===c?'selected':''}>${esc(n)}</option>`).join('')}</select>`}

function b64d(x){return JSON.parse(decodeURIComponent(escape(atob(x))))}
function myShifts(){if(!CAL)return[];const me=norm(RQ.name);const key=Object.keys(CAL.a).find(n=>norm(n)===me);if(!key)return[];
  const[y,m]=CAL.m.split('-').map(Number);
  return CAL.a[key].map(([d,c])=>{const[name,st,en]=CAL.t[c]||[c,'08:00','16:00'];const[sh,sm]=st.split(':').map(Number),[eh,em]=en.split(':').map(Number);
    const s=[y,m,d,sh,sm],ed=new Date(y,m-1,d+((eh*60+em)<=(sh*60+sm)?1:0));return{d,c,name,st,en,s,e:[ed.getFullYear(),ed.getMonth()+1,ed.getDate(),eh,em]}}).sort((a,b)=>a.d-b.d||a.st.localeCompare(b.st))}
const p2=n=>String(n).padStart(2,'0');
const loc=a=>`${a[0]}${p2(a[1])}${p2(a[2])}T${p2(a[3])}${p2(a[4])}00`;
function toUTC(a){const guess=Date.UTC(a[0],a[1]-1,a[2],a[3],a[4]);const f=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const P=Object.fromEntries(f.formatToParts(new Date(guess)).map(x=>[x.type,x.value]));const asTz=Date.UTC(+P.year,+P.month-1,+P.day,+P.hour,+P.minute);const dt=new Date(guess-(asTz-guess));
  return`${dt.getUTCFullYear()}${p2(dt.getUTCMonth()+1)}${p2(dt.getUTCDate())}T${p2(dt.getUTCHours())}${p2(dt.getUTCMinutes())}00Z`}
function gLink(x){return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.name)+'&dates='+loc(x.s)+'/'+loc(x.e)+'&ctz=Asia/Jerusalem&details='+encodeURIComponent('משמרת במיון. להוסיף תזכורת יום לפני: בחלון שנפתח, "הוספת התראה" ← יום אחד.')}
function icsText(list){const now=toUTC((()=>{const n=new Date();return[n.getFullYear(),n.getMonth()+1,n.getDate(),n.getHours(),n.getMinutes()]})());
  const esc2=t=>String(t).replace(/[\\,;]/g,m=>'\\'+m);const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ED roster//HE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const x of list){L.push('BEGIN:VEVENT',`UID:${CAL.m}-${x.d}-${x.c}-${encodeURIComponent(norm(RQ.name))}@ed-roster`,`DTSTAMP:${now}`,`DTSTART:${toUTC(x.s)}`,`DTEND:${toUTC(x.e)}`,`SUMMARY:${esc2(x.name)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2('מחר: '+x.name)}`,'TRIGGER:-P1D','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.join('\r\n')}
async function saveIcs(list){const txt=icsText(list),fname=`משמרות_${kLabel(CAL.m).replace(' ','_')}.ics`;
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:fname,data:new Blob([txt],{type:'text/calendar'})});toast('הקובץ נשמר')}catch(e){if(!(e&&e.code==='declined'))toast('השמירה לא הושלמה')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download=fname;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('ההורדה לא זמינה בדפדפן הזה. השתמשו בכפתורי Google')}}

function quota(){const f=Math.max(0,1-RQ.vac.size/kDim(RQ.m));return RQ.g==='A'?`מכסה משוערת: ${Math.round(BASE.AS*f)} משמרות ו־${Math.round(BASE.AD*f)} תורנויות`:`מכסה משוערת: ${Math.round(BASE.RD*f)} תורנויות`}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function buildReq(){return{v:1,m:RQ.m,n:norm(RQ.name),g:RQ.g,r:norm(RQ.rot),vac:[...RQ.vac].sort((a,b)=>a-b),vby:norm(RQ.vby),b:[...RQ.b.keys()].sort((a,b)=>a-b),bp:RQ.g==='A'?[...RQ.b].filter(([d,p])=>p).sort((a,b)=>a[0]-b[0]):[],bu:units().sort((a,b)=>a-b),s:[...RQ.s].sort((a,b)=>a-b),w:[...RQ.w].sort((a,b)=>a[0]-b[0]),t:RQ.t.trim(),ts:Date.now()}}
function message(q){const L=[`בקשות משמרות ל${kLabel(q.m)}`,`שם: ${q.n} (${q.g==='A'?'אגף א':'רוטציה'+(q.r?' '+q.r:'')})`,`חסימות (${q.bu.length}${q.g==='A'?' משמרות':''}): ${q.b.map(d=>{const p=(q.bp.find(x=>x[0]===d)||[])[1];return p?`${d} (${p==='day'?'יום':p==='duty'?'תורנות':'לילה'})`:String(d)}).join(', ')||'אין'}`];
  if(q.vac.length)L.push(`חופשה מאושרת (${q.vac.length} ימים, אישר: ${q.vby}): ${q.vac.join(', ')}`);
  if(q.s.length)L.push(`מעדיף שלא: ${q.s.join(', ')}`);
  if(q.w.length)L.push(`רוצה לעבוד: ${q.w.map(([d,c])=>c?`${d} (${TNAME[c]||c})`:String(d)).join(', ')}`);
  if(q.t)L.push(`הערות: ${q.t}`);L.push('','#REQ:'+b64e(q));return L.join('\n')}
function openSheet(html){const layer=$('#layer');layer.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const ov=layer.firstChild;
  const close=()=>{layer.innerHTML='';document.removeEventListener('keydown',kd)};const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))close()});return{el:ov.firstChild,close}}
function copyText(txt){const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'ההודעה הועתקה':'ההעתקה נחסמה. סמנו את הטקסט והעתיקו ידנית')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('ההודעה הועתקה'),fb);else fb()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.closest('#main'))return;
  if(b.dataset.view){setView(b.dataset.view);return}
  if(b.id==='calLoad'){const m=($('#calPaste').value||'').match(/#CAL:([A-Za-z0-9+/=]+)/);if(!m){toast('לא נמצאה שורת #CAL בהודעה');return}
    try{CAL=b64d(m[1]);localStorage.setItem('ed-cal-v1',JSON.stringify(CAL))}catch(e){if(!CAL||!CAL.a){toast('הקוד פגום. העתיקו את כל ההודעה');return}}
    toast('הלוח נטען');render();return}
  if(b.id==='calIcs'){saveIcs(myShifts());return}
  if(b.dataset.chk){CH.kind=b.dataset.chk;render();return}
  if(b.id==='chSend'){
    const miss=[];if(!norm(RQ.name))miss.push('השם שלך');if(!CH.d1||!CH.c1)miss.push('המשמרת שלך');if(!norm(CH.w))miss.push('שם המתמחה השני');if(CH.kind==='swap'&&(!CH.d2||!CH.c2))miss.push('המשמרת של המתמחה השני');
    if(miss.length){toast('חסר: '+miss.join(', '),3500);return}
    if(norm(CH.w)===norm(RQ.name)){toast('המתמחה השני צריך להיות מישהו אחר');return}
    if(!CH.agree&&!confirm('לא סימנת שהמתמחה השני מסכים. לשלוח בכל זאת?'))return;
    const q={v:1,type:'chg',m:CH.m,n:norm(RQ.name),kind:CH.kind,d1:+CH.d1,c1:CH.c1,w:norm(CH.w),d2:CH.kind==='swap'?+CH.d2:null,c2:CH.kind==='swap'?CH.c2:null,agree:CH.agree,t:CH.t.trim(),ts:Date.now()};
    const L=[`בקשת ${q.kind==='swap'?'החלפה':'מסירת משמרת'} ל${kLabel(q.m)}`,`${q.n}: ${TNAME[q.c1]} ב־${q.d1}`,q.kind==='swap'?`מתחלף עם ${q.w}: ${TNAME[q.c2]} ב־${q.d2}`:`עובר ל${q.w}`,`המתמחה השני מסכים: ${q.agree?'כן':'לא סומן'}`];
    if(q.t)L.push('הערה: '+q.t);L.push('','#CHG:'+b64e(q));const msg=L.join('\n');
    const sh=openSheet(`<h3>ההודעה מוכנה</h3><p class="sub">שלחו אותה לרכז/ת השיבוץ. השורה האחרונה היא קוד שהמערכת קוראת, אל תשנו אותה.</p><textarea class="msgbox" readonly>${esc(msg)}</textarea><div class="done">השינוי ייכנס ללוח רק אחרי אישור.</div><div class="foot"><button class="btn primary" id="shCopy">העתק</button>${navigator.share?'<button class="btn" id="shShare">שתף</button>':''}<button class="btn" data-close>סגור</button></div>`);
    sh.el.querySelector('#shCopy').onclick=()=>copyText(msg);const sb=sh.el.querySelector('#shShare');if(sb)sb.onclick=()=>navigator.share({text:msg}).catch(()=>{});
    return}
  if(b.dataset.bpart!==undefined){RQ.bpart=b.dataset.bpart;persist();render();return}
  if(b.dataset.rqg){RQ.g=b.dataset.rqg;RQ.wcode='';persist();render();return}
  if(b.dataset.rqmode){RQ.mode=b.dataset.rqmode;persist();render();return}
  if(b.dataset.rqday){const d=Number(b.dataset.rqday);
    if(RQ.mode==='v'){if(RQ.vac.has(d))RQ.vac.delete(d);else{RQ.vac.add(d);RQ.b.delete(d);RQ.s.delete(d);RQ.w.delete(d)}}
    else if(RQ.mode==='b'){
      const part=RQ.g==='A'?RQ.bpart:'';
      if(RQ.b.has(d)&&RQ.b.get(d)===part){RQ.b.delete(d)}
      else{const ru=rulesFor(RQ.g),prev=RQ.b.has(d)?RQ.b.get(d):null;
        const old=RQ.b.get(d);RQ.b.set(d,part);const u=units(),wk=u.filter(x=>kWeekend(RQ.m,x)).length;
        if(u.length>ru.max||(kWeekend(RQ.m,d)&&wk>ru.wk)){if(prev===null)RQ.b.delete(d);else RQ.b.set(d,old);
          const over=u.length>ru.max;
          ruleModal(over?'הגעת למקסימום החסימות':'הגעת למקסימום החסימות בסופ״ש',[
            over?(RQ.g==='A'?`באגף א אפשר לחסום עד ${ru.max} משמרות. חסימת יום שלם נספרת כשתי משמרות.`:`ברוטציה אפשר לחסום עד ${ru.max} תאריכים.`):`אפשר לחסום עד ${ru.wk} ${RQ.g==='A'?'משמרות':'תאריכים'} בסופ״ש או בחג.`,
            RQ.g==='A'&&over?'אפשר לחסום רק יום או רק לילה במקום יום שלם, כדי לחסוך.':'אפשר לבטל חסימה אחרת ולסמן את התאריך הזה במקומה.',
            'לימים נוספים סמנו "מעדיף שלא". נשתדל להתחשב, בלי התחייבות.',
            'חופשה שאושרה מראש לא נספרת בחסימות. סמנו אותה ב"חופשה מאושרת".']);return}
        RQ.s.delete(d);RQ.w.delete(d);RQ.vac.delete(d)}}
    else if(RQ.mode==='s'){RQ.vac.delete(d);if(RQ.s.has(d))RQ.s.delete(d);else{RQ.s.add(d);RQ.b.delete(d);RQ.w.delete(d)}}
    else{RQ.vac.delete(d);if(RQ.w.has(d)&&RQ.w.get(d)===RQ.wcode)RQ.w.delete(d);else{RQ.w.set(d,RQ.wcode);RQ.b.delete(d);RQ.s.delete(d)}}
    persist();render();return}
  if(b.id==='rqReset'){if(!confirm('לנקות את כל הסימונים?'))return;RQ.b=new Map();RQ.s=new Set();RQ.w=new Map();RQ.vac=new Set();persist();render();return}
  if(b.id==='rqSend'){
    if(!norm(RQ.name)){toast('כתבו את השם שלכם');$('#rqName').focus();return}
    if(RQ.vac.size&&!norm(RQ.vby)){toast('כתבו מי אישר את החופשה');return}
    const chk=checkBlocks(RQ.m,RQ.g,units());if(chk.errs.length){ruleModal('הבקשה חורגת מהכללים',[...chk.errs,'תקנו את החסימות בלוח ונסו שוב.']);return}
    const msg=message(buildReq());
    const sh=openSheet(`<h3>ההודעה מוכנה</h3><p class="sub">שלחו אותה בוואטסאפ לרכז/ת השיבוץ. השורה האחרונה היא קוד שהמערכת קוראת, אל תשנו אותה.</p><textarea class="msgbox" readonly>${esc(msg)}</textarea><div class="done">אם תשנו משהו לפני שהלוח נבנה, שלחו הודעה חדשה והיא תחליף את הקודמת.</div><div class="foot"><button class="btn primary" id="shCopy">העתק</button>${navigator.share?'<button class="btn" id="shShare">שתף</button>':''}<button class="btn" data-close>סגור</button></div>`);
    sh.el.querySelector('#shCopy').onclick=()=>copyText(msg);const sb=sh.el.querySelector('#shShare');if(sb)sb.onclick=()=>navigator.share({text:msg}).catch(()=>{});
  }
});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='chN'){RQ.name=e.target.value;persist();return}if(id==='chW'){CH.w=e.target.value;return}if(id==='chT'){CH.t=e.target.value;return}if(id==='rqNotes')RQ.t=e.target.value;else if(id==='rqRot')RQ.rot=e.target.value;else if(id==='rqName')RQ.name=e.target.value;else if(id==='rqVby')RQ.vby=e.target.value;else return;persist()});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='rqMonth'){RQ.m=e.target.value;RQ.b=new Map();RQ.s=new Set();RQ.w=new Map();RQ.vac=new Set();persist();render()}
  else if(id==='rqWcode'){RQ.wcode=e.target.value;persist()}
  else if(id==='calName'){RQ.name=e.target.value;persist();render()}
  else if(id==='chM'){CH.m=e.target.value;CH.d1='';CH.d2='';render()}
  else if(id==='chD1')CH.d1=e.target.value;else if(id==='chC1')CH.c1=e.target.value;else if(id==='chD2')CH.d2=e.target.value;else if(id==='chC2')CH.c2=e.target.value;else if(id==='chAgree')CH.agree=e.target.checked});
render();
</script>
</body>
</html>
