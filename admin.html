<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שיבוץ מתמחים ברפואה דחופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#16222B; --muted:#5A6770;
  --line:#CFD7D5; --line2:#E2E7E5; --primary:#1C4E79; --primary-ink:#FFFFFF;
  --danger:#B3261E; --danger-bg:#FBE6E4; --ok-bg:#DCF1E1; --warn:#9A5800; --warn-bg:#FFF0D6; --ok:#2C6A3E;
  --wk:#E3EAF1; --eve:#EFEBDD; --hol:#F4E4C2; --vac:#DDE3E1;
  --radius-s:4px; --radius-m:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171C; --surface:#172127; --surface2:#1C2830; --ink:#E4EAED; --muted:#98A6AE;
    --line:#2D3B43; --line2:#233139; --primary:#86B6E2; --primary-ink:#0A1824;
    --danger:#FF8C82; --danger-bg:#3B1C1A; --ok-bg:#163421; --warn:#F0B45C; --warn-bg:#33270F; --ok:#8FD0A0;
    --wk:#1B2631; --eve:#23241A; --hol:#2E2614; --vac:#253238; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171C; --surface:#172127; --surface2:#1C2830; --ink:#E4EAED; --muted:#98A6AE;
  --line:#2D3B43; --line2:#233139; --primary:#86B6E2; --primary-ink:#0A1824;
  --danger:#FF8C82; --danger-bg:#3B1C1A; --ok-bg:#163421; --warn:#F0B45C; --warn-bg:#33270F; --ok:#8FD0A0;
  --wk:#1B2631; --eve:#23241A; --hol:#2E2614; --vac:#253238; color-scheme: dark;
}
/* shift colours */
.c-amber{--cb:#FBE8BC;--cf:#5E3F00}.c-indigo{--cb:#DCDDF6;--cf:#262A7A}.c-blue{--cb:#D8E7F7;--cf:#173F66}
.c-teal{--cb:#D2ECE6;--cf:#0C4D40}.c-olive{--cb:#E6EACB;--cf:#434A10}.c-rose{--cb:#F7DCE3;--cf:#6E1F36}
.c-violet{--cb:#E9DDF5;--cf:#4A2472}.c-crimson{--cb:#F6D4D0;--cf:#7A1A12}.c-slate{--cb:#E1E5E8;--cf:#33414B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-amber{--cb:#4A3A12;--cf:#FBE3A6}:root:not([data-theme="light"]) .c-indigo{--cb:#2B2E5E;--cf:#CFD1FA}:root:not([data-theme="light"]) .c-blue{--cb:#1D3650;--cf:#C9DFF6}:root:not([data-theme="light"]) .c-teal{--cb:#15413A;--cf:#BDE9DE}:root:not([data-theme="light"]) .c-olive{--cb:#383C16;--cf:#E1E6B5}:root:not([data-theme="light"]) .c-rose{--cb:#4D2230;--cf:#F6CCD8}:root:not([data-theme="light"]) .c-violet{--cb:#3A2654;--cf:#E3D0F7}:root:not([data-theme="light"]) .c-crimson{--cb:#521F1A;--cf:#F8C8C1}:root:not([data-theme="light"]) .c-slate{--cb:#2C363D;--cf:#D6DDE2}}
:root[data-theme="dark"] .c-amber{--cb:#4A3A12;--cf:#FBE3A6}:root[data-theme="dark"] .c-indigo{--cb:#2B2E5E;--cf:#CFD1FA}:root[data-theme="dark"] .c-blue{--cb:#1D3650;--cf:#C9DFF6}:root[data-theme="dark"] .c-teal{--cb:#15413A;--cf:#BDE9DE}:root[data-theme="dark"] .c-olive{--cb:#383C16;--cf:#E1E6B5}:root[data-theme="dark"] .c-rose{--cb:#4D2230;--cf:#F6CCD8}:root[data-theme="dark"] .c-violet{--cb:#3A2654;--cf:#E3D0F7}:root[data-theme="dark"] .c-crimson{--cb:#521F1A;--cf:#F8C8C1}:root[data-theme="dark"] .c-slate{--cb:#2C363D;--cf:#D6DDE2}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 10px;max-width:100%}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav select{font-size:16px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:6px 10px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 12px;font-weight:500;min-height:36px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:3px 9px;min-height:28px;font-size:13px}

nav.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
main{padding:14px 20px 40px}

.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pill.mid{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.good{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12.5px;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}

/* grid */
.gridwrap{overflow:auto;max-height:calc(100vh - 230px);min-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px}
.grid th,.grid td{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:0;text-align:center;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:600}
.grid thead tr:nth-child(2) th{top:26px}
.grid thead tr:first-child th{height:26px}
.grid thead tr:nth-child(2) th{height:22px;color:var(--muted);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--line)}
.grid .namecol{position:sticky;right:0;z-index:2;background:var(--surface);text-align:right;padding:0 10px;min-width:118px;max-width:150px;border-left:1px solid var(--line)}
.grid thead .namecol{z-index:4}
.grid .namecol button{border:0;background:none;padding:6px 0;text-align:right;width:100%;font-weight:600}
.grid .namecol small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:-4px;padding-bottom:4px;overflow:hidden;text-overflow:ellipsis}
.grid .stat{min-width:44px;padding:0 4px;font-variant-numeric:tabular-nums;font-weight:600}
.sig{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:10px;text-align:center;font-weight:700;vertical-align:1px}
.stat.under{color:var(--muted)}.stat.hi{color:var(--warn)}.stat.lo{color:var(--primary)}.stat.over{color:var(--danger)}.stat.done{color:var(--ok)}.stat.na{color:var(--muted);font-weight:400}
.grid th.day{min-width:42px;cursor:pointer}
.grid th.day:hover{background:var(--surface2)}
.grid .wk{background:var(--wk)}
.grid .eve{background:var(--eve)}
.grid .hol{background:var(--hol)}
.grid thead th.wk,.grid thead th.eve,.grid thead th.hol{background-clip:padding-box}
.grid tr.grp td{background:var(--surface2);text-align:right;font-weight:700;padding:6px 10px;color:var(--muted);font-size:12px}
.cell{width:42px;height:34px;min-width:42px;border:0;background:none;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
td.cellwrap{position:relative}
.cell:hover{background:rgba(28,78,121,.07)}
.chip{display:inline-block;background:var(--cb);color:var(--cf);border-radius:var(--radius-s);padding:0 3px;font-size:11px;font-weight:600;line-height:15px;max-width:40px;overflow:hidden}
.mk-vac{background:repeating-linear-gradient(135deg,var(--vac) 0 4px,transparent 4px 8px)}
.mk-off::after{content:"";position:absolute;inset:9px 12px;border-top:2px solid var(--muted);transform:rotate(-35deg);opacity:.55;pointer-events:none}
.mk-soft .cell::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mk-want .cell::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
td.err{box-shadow:inset 0 0 0 2px var(--danger)}
td.warn{box-shadow:inset 0 0 0 2px var(--warn)}
tr.cov td{height:26px;font-size:11.5px}
tr.cov td.namecol{font-weight:600;font-size:12px}
tr.covhead td{background:var(--surface2);font-weight:700;color:var(--muted);font-size:12px;text-align:right;padding:6px 10px;border-top:2px solid var(--line)}
.covbtn{border:0;background:none;width:42px;height:26px;padding:0 2px;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.covbtn.miss{background:var(--danger-bg);color:var(--danger);font-weight:700}
.covbtn.extra{color:var(--warn);font-weight:600}
.covbtn.none{color:var(--line)}

/* forms/tables in other tabs */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p.hint{margin:0 0 12px;color:var(--muted);font-size:13px;max-width:70ch}
.tablewrap{overflow-x:auto}
table.form{border-collapse:collapse;width:100%;font-size:13px}
table.form th{text-align:right;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.form td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
table.form input[type=text],table.form input[type=number],table.form input[type=time],table.form select,table.form textarea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 6px}
table.form input[type=number]{width:62px}
table.form input.w-name{width:110px}
table.form input.w-short{width:64px}
table.form textarea{width:100%;min-width:220px;min-height:34px;resize:vertical}
.wdbox{display:flex;gap:2px}
.wdbox label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.prefchips{display:flex;flex-wrap:wrap;gap:3px;max-width:330px}
.prefchips button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);font-size:11.5px;padding:1px 5px}
.prefchips button.pref{background:#D8F0DE;color:#1E5A2C;border-color:#9ED0AA}
.prefchips button.avoid{background:var(--danger-bg);color:var(--danger);border-color:transparent;text-decoration:line-through}
.kv{display:flex;flex-wrap:wrap;gap:16px}
.kv label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.kv input{width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 7px;font-size:15px;color:var(--ink)}

table.luach{border-collapse:collapse;font-size:13px;background:var(--surface)}
table.luach th,table.luach td{border:1px solid var(--line2);padding:5px 8px;text-align:right;white-space:nowrap}
table.luach thead th{position:sticky;top:0;background:var(--surface);z-index:1}
table.luach td.miss{background:var(--danger-bg);color:var(--danger);font-weight:600}

/* sheet dialog */
.overlay{position:fixed;inset:0;background:rgba(10,20,28,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:18px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet h3{margin:0;font-size:18px}
.sheet .sub{color:var(--muted);margin:2px 0 12px;font-size:13px}
.sheet h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:6px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:600}
.opt.dim{opacity:.55}
.opt .chip{max-width:none}
.note{background:var(--surface2);border-radius:var(--radius-m);padding:8px 10px;font-size:13px;white-space:pre-wrap}
.issues{margin:6px 0 0;padding:0 18px 0 0;font-size:13px}
.issues li.err{color:var(--danger)}.issues li.warn{color:var(--warn)}
.cands{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:var(--radius-m);overflow:hidden}
.cand{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line2)}
.cand:last-child{border-bottom:0}
.cand .who{font-weight:600;min-width:74px}
.cand .why{flex:1;color:var(--muted);font-size:12.5px}
.cand.blocked .who{color:var(--muted);font-weight:500}
.sheet .foot{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-m);font-weight:500;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.rules{background:var(--surface2);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:14px;font-size:13.5px;max-width:74ch}
.rules strong{display:block;margin-bottom:4px}
.rules ul{margin:0;padding-right:18px}.rules li{margin:2px 0}
.fields{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields input,.fields select,.req textarea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-m);padding:7px 9px;font-size:15px;color:var(--ink)}
.req textarea{width:100%;max-width:520px;min-height:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:8px 12px;font-weight:600;min-height:38px}
.seg button:last-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:520px;margin:10px 0 14px}
.cal .wdh{text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.cal button.d{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:15px;min-height:50px;padding:2px}
.cal button.d.wke{background:var(--wk)}
.cal button.d.hol{background:var(--hol)}
.cal button.d small{font-size:10.5px;font-weight:600;line-height:1.1}
.cal button.d.b{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.cal button.d.s{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cal button.d.w{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.errs{color:var(--danger);font-size:13px;font-weight:600;margin:4px 0}
table.form td.bad{color:var(--danger);font-weight:700}
table.form td.okc{color:var(--ok);font-weight:600}
.msgbox{width:100%;min-height:180px;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-m);padding:8px;white-space:pre-wrap;color:var(--ink)}
@media (max-width:640px){
  header.top{padding:14px 12px 8px}
  .toolbar{padding:0 12px 10px}
  nav.tabs{padding:0 8px}
  main{padding:12px 8px 40px}
  .brand h1{font-size:19px}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:14px 14px 0 0;max-height:88%;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .grid .namecol{min-width:92px}
  .gridwrap{max-height:calc(100vh - 260px)}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
@media print{.toolbar,nav.tabs,.status,.legend,.monthnav select{display:none}.gridwrap{max-height:none;overflow:visible;border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>שיבוץ מתמחים ברפואה דחופה</h1>
    <p id="subtitle"></p><p id="sync" style="margin:2px 0 0;color:var(--muted);font-size:12px"></p>
  </div>
  <div class="monthnav">
    <label for="monthSel" class="hidden">חודש</label>
    <select id="monthSel" aria-label="חודש"></select>
  </div>
</header>
<div class="toolbar">
  <button class="btn primary" id="bAuto">מלא משבצות חסרות</button>
  <button class="btn" id="bUndo" disabled>בטל פעולה</button>
  <button class="btn" id="bNew">חודש חדש</button>
  <button class="btn" id="bImport">ייבוא מאקסל</button>
  <button class="btn" id="bExport">ייצוא לאקסל</button>
  <button class="btn danger" id="bClear">נקה שיבוצים</button>
  <input type="file" id="fileIn" accept=".xlsx,.xls" class="hidden">
</div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="request" aria-selected="false">הגשת בקשות</button>
  <button role="tab" data-tab="grid" aria-selected="true">שיבוץ</button>
  <button role="tab" data-tab="inbox" aria-selected="false" id="tabInbox">בקשות והחלפות</button>
  <button role="tab" data-tab="people" aria-selected="false">מתמחים וסבבים</button>
  <button role="tab" data-tab="luach" aria-selected="false">לוח יומי</button>
  <button role="tab" data-tab="settings" aria-selected="false">משמרות וכללים</button>
</nav>
<main id="main"></main>
<div id="layer"></div>

<script>

function monthTab(key){
  const saveCur=S.cur;S.cur=key;try{
    const N=dim(),A=analyze(),rows=[['שם','קבוצה',...[...Array(N)].map((_,i)=>i+1),'משמרות','תורנויות','סופ״ש','הערות'],['','',...[...Array(N)].map((_,i)=>WD[wd(i+1)]+(dtype(i+1)==='hol'?' חג':dtype(i+1)==='eve'?' ע״ח':'')),'','','','']];
    for(const pid of rosterIds()){const r=M().roster[pid],P=A.per[pid];
      rows.push([pname(pid),r.group==='A'?'אגף א':r.group==='X'?(r.rot||'לא זמין'):(r.rot||'רוטציה'),...[...Array(N)].map((_,i)=>{const cl=cellOf(pid,i+1);const parts=cl.c.map(c=>typeBy(c)?.short||c);if(cl.mk==='vac')parts.push('חופש');else if(cl.mk==='off')parts.push(cl.part==='day'?'חסום יום':cl.part==='night'?'חסום לילה':cl.part==='duty'?'חסום תורנות':'חסום');return parts.join(' + ')}),P.cnt.shift,P.cnt.duty,P.cnt.wk.size,r.notes||''])}

    const cols=S.types.filter(t=>{for(let d=1;d<=N;d++)if(need(t.code,d)||filled(t.code,d).length)return true;return false});
    rows.push(['תאריך','יום',...cols.map(t=>t.name)]);
    for(let d=1;d<=N;d++)rows.push([d,WD[wd(d)],...cols.map(t=>{const f=filled(t.code,d);return f.length?f.map(pname).join(', '):need(t.code,d)?'חסר':''})]);

  }finally{S.cur=saveCur}
}
async function pushState(){
  if(!(S.settings.apiUrl&&S.settings.apiKey))return;
  if(!S.synced){loadFromServer();return}
  try{ensurePlanNames();const st={...S,settings:{...S.settings,apiKey:''}};
    const r=await fetch(S.settings.apiUrl,{method:'POST',body:JSON.stringify({action:'saveState',key:S.settings.apiKey,ts:S.savedAt,state:JSON.stringify(st),tab:monthTab(S.cur)})});const j=await r.json();

    setSync('נשמר בגיליון '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}))}
  catch(e){setSync('השמירה בגיליון נכשלה: '+e.message)}
}
async function loadFromServer(){
  if(!(S.settings&&S.settings.apiUrl&&S.settings.apiKey))return;
  setSync('בודק בגיליון…');
  try{const r=await fetch(S.settings.apiUrl+'?action=state&key='+encodeURIComponent(S.settings.apiKey));const j=await r.json();
    if(!j.ok){setSync(j.error==='action'?'צריך לעדכן את הקוד בגיליון':'');return}
    const markSynced=()=>{S.synced=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
    if(!j.state){markSynced();pushState();return}
    if(!S.synced||Number(j.ts)>(S.savedAt||0)){
      if(!S.synced&&S.savedAt&&Number(j.ts)<S.savedAt&&!confirm(`בגיליון שמורים נתונים מ־${new Date(Number(j.ts)).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}. לטעון אותם? הנתונים שבמכשיר הזה יוחלפו.\n(ביטול ישמור את הנתונים שבמכשיר הזה בגיליון במקום)`)){markSynced();pushState();return}
      const x=JSON.parse(j.state);x.synced=true;x.settings=x.settings||{};x.settings.apiUrl=S.settings.apiUrl;x.settings.apiKey=S.settings.apiKey;x.lastTab=tab;
      try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}location.reload();return}
    if(Number(j.ts)<(S.savedAt||0)){pushState();return}
    setSync('מעודכן מול הגיליון')}
  catch(e){setSync('אין חיבור לגיליון')}
}

function dayClass(d){const t=dtype(d);if(t==='hol')return'hol';if(t==='eve')return'eve';const w=wd(d);return(w===5||w===6)?'wk':''}
function typeBy(code){return S.types.find(t=>t.code===code)}
function hm(s){const[a,b]=(s||'0:0').split(':').map(Number);return a*60+(b||0)}
function iv(code,d){const t=typeBy(code);if(!t)return null;const base=(d-1)*1440;let s=base+hm(t.start),e=base+hm(t.end);if(e<=s)e+=1440;return{s,e}}
function isMorn(t){return hm(t.start)<720}
function isNight(t){return hm(t.end)<=hm(t.start)}
function availFrac(pid){return Math.max(0.15,1-vacDays(pid)/dim())}
function isSigner(pid){const p=person(pid);return!!(p&&p.signer)&&M().roster[pid]&&M().roster[pid].group!=='X'}
function sigDay(d){return S.types.some(t=>t.signer&&need(t.code,d))}
function signersOn(d){return rosterIds().filter(p=>isSigner(p)&&cellOf(p,d).c.some(c=>typeBy(c)?.signer))}
function qualified(pid,t){return!t.restrict||!!(person(pid)?.quals||{})[t.code]}
function internalCount(){let n=0;for(let d=1;d<=dim();d++)for(const t of S.types)if(t.internal)n+=filled(t.code,d).length;return n}
function homeOf(pid){const r=M().roster[pid];if(!r||r.group!=='R')return'';if(r.home!==undefined)return r.home;return/ב\s*\+\s*ג|צד\s*ב|כירורגיה/.test(r.rot||'')?'b':''}
function sigReqOn(t,d){return!!(t.sigReq&&t.sigReq[wd(d)])}
const PARTS={'':'כל היום',day:'יום (09–21)',night:'לילה (21–09)',duty:'תורנות (16–08)'};
function blockWin(d,part){const b=(d-1)*1440;return part==='day'?{s:b+540,e:b+1260}:{s:b+1260,e:b+1980}}
function blockHit(pid,x,d0,t){for(const dd of [d0-1,d0,d0+1]){if(dd<1||dd>dim())continue;const cl=cellOf(pid,dd);if(cl.mk!=='off')continue;
  if(!cl.part){if(dd===d0)return'יום שלם';continue}
  if(cl.part==='duty'){if(dd===d0&&t&&t.kind==='duty')return`תורנות ב־${dd}`;continue}const w=blockWin(dd,cl.part);if(x.s<w.e&&w.s<x.e)return`${cl.part==='day'?'יום':'לילה'} ב־${dd}`}return''}
function blockUnits(pid,g){const u=[];for(let d=1;d<=dim();d++){const cl=cellOf(pid,d);if(cl.mk!=='off')continue;u.push(d);if(g==='A'&&!cl.part)u.push(d)}return u}
const WCAT={'@day':'משמרת יום','@night':'משמרת לילה','@duty':'תורנות'};
function wcName(wc){return WCAT[wc]||typeBy(wc)?.name||wc}
function wcMatch(wc,t){if(!wc)return true;if(wc==='@day')return isMorn(t)&&!isNight(t)&&t.kind!=='duty';if(wc==='@night')return isNight(t)&&t.kind==='shift';if(wc==='@duty')return t.kind==='duty';return wc===t.code}
function rulesOf(pid){return(person(pid)||{}).rules||{}}
function isFriLike(d){return wd(d)===5||dtype(d)==='eve'}
function units(pid,t,d){const r=M().roster[pid];if(t.kind!=='shift'&&t.kind!=='duty')return null;
  const ru=rulesOf(pid);if(r&&r.group==='A'&&ru.friLong&&ru.friLong!=='one'&&t.kind==='shift'&&isMorn(t)&&!isNight(t)&&isFriLike(d))return ru.friLong==='two'?{shift:2,duty:0}:{shift:0,duty:1};
  return t.kind==='shift'?{shift:1,duty:0}:{shift:0,duty:1}}
function addUnits(c,pid,t,d,sign){const u=units(pid,t,d);if(!u){c[t.kind]+=sign;return}c.shift+=sign*u.shift;c.duty+=sign*u.duty}
function shabbatHit(pid,x){const r=M().roster[pid];if(!r||r.group!=='A'||!rulesOf(pid).shabbat)return false;
  for(let dd=1;dd<=dim();dd++){if(!(wd(dd)===6||dtype(dd)==='hol'))continue;const ws=(dd-1)*1440-180,we=(dd-1)*1440+1260;if(x.s<we&&ws<x.e)return true}return false}
function isICU(pid){const r=M().roster[pid];return!!r&&r.group==='R'&&/ICU|טנ.?צ|טיפול\s*נמרץ/i.test(r.rot||'')}
function wkndMorning(t,d){return t.code==='b'&&isWeekend(d)}
function person(id){return S.people.find(p=>p.id===id)}
function pname(id){return person(id)?.name||'?'}
function cellOf(pid,d){return M().cells[pid+'|'+d]||{c:[],mk:''}}
function setCell(pid,d,cell){const k=pid+'|'+d,old=M().cells[k],mk=cell.mk||'';let wc=cell.wc!==undefined?cell.wc:(old&&old.wc);if(mk!=='want')wc='';let part=cell.part!==undefined?cell.part:(old&&old.part);if(mk!=='off')part='';if(!cell.c.length&&!mk)delete M().cells[k];else{M().cells[k]={c:cell.c.slice(),mk};if(wc)M().cells[k].wc=wc;if(part)M().cells[k].part=part}}
function rosterIds(){const R=M().roster;const go={A:0,R:1,X:2};return Object.keys(R).filter(id=>person(id)).sort((a,b)=>(go[R[a].group]-go[R[b].group])||(R[a].order-R[b].order))}
function need(code,d){const ov=M().needOv[code+'|'+d];if(ov!==undefined)return ov;const t=typeBy(code);if(!t)return 0;const dt=dtype(d);const idx=dt==='hol'?6:dt==='eve'?5:wd(d);return t.need[idx]?1:0}
function filled(code,d){return rosterIds().filter(id=>cellOf(id,d).c.includes(code))}
function vacDays(pid){let n=0;for(let d=1;d<=dim();d++)if(cellOf(pid,d).mk==='vac')n++;return n+(Number(M().roster[pid].extraVac)||0)}
function targets(pid){
  const r=M().roster[pid], st=S.settings, frac=Math.max(0,1-vacDays(pid)/dim());
  let S_=0,D_=0;
  if(r.group==='A'){S_=st.baseAS*frac;D_=st.baseAD*frac}else if(r.group==='R'){const rd=rulesOf(pid).rotD;D_=(rd!==undefined&&rd!==''&&!isNaN(rd)?Number(rd):st.baseRD)*frac}
  if(r.tS!==null&&r.tS!==''&&!isNaN(r.tS))S_=Number(r.tS);
  if(r.tD!==null&&r.tD!==''&&!isNaN(r.tD))D_=Number(r.tD);
  return{S:Math.round(S_),D:Math.round(D_),Sraw:S_,Draw:D_}
}
function fmtDate(d){const[,m]=ym();return `${WD_LONG[wd(d)]} ${d}.${m}`}
function toast(msg,ms=2600){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),ms)}

/* ---------- analysis ---------- */
function analyze(){
  const ids=rosterIds(), st=S.settings, N=dim();
  const per={}, issues={};
  const add=(pid,d,lvl,msg)=>{const k=pid+'|'+d;(issues[k]=issues[k]||{lvl:'warn',msgs:[]});if(lvl==='err')issues[k].lvl='err';if(!issues[k].msgs.includes(msg))issues[k].msgs.push(msg)};
  for(const pid of ids){
    const r=M().roster[pid]; const list=[]; const cnt={shift:0,duty:0,day:0,other:0,wk:new Set(),n:0,mo:0,ni:0};
    for(let d=1;d<=N;d++){
      const cl=cellOf(pid,d);
      for(const code of cl.c){
        const t=typeBy(code); if(!t){add(pid,d,'warn',`קוד לא מוכר: ${code}`);continue}
        const x=iv(code,d); list.push({d,code,...x}); addUnits(cnt,pid,t,d,1);if(shabbatHit(pid,x))add(pid,d,'err','לפי הכללים האישיים לא עובד בשבת (מליל שישי 21:00 עד מוצ״ש 21:00)'); if(code==='n')cnt.n++; if(isMorn(t))cnt.mo++; if(isNight(t))cnt.ni++;
        if(isWeekend(d))cnt.wk.add(d);
        if(sigReqOn(t,d)&&!isSigner(pid))add(pid,d,'err',`ב${t.name} ביום ${WD_LONG[wd(d)]} נדרש חותם שחרור`);
        if(!qualified(pid,t))add(pid,d,'err',`לא מאושר ל${t.name}`);
        if(wkndMorning(t,d)&&!cl.c.includes('v'))add(pid,d,'warn','בסופ״ש ובחג בוקר צד ב עושה מי שבתורנות צד ב באותו יום');
        if(r.group==='X')add(pid,d,'warn','המתמחה מסומן כלא זמין החודש');
        else if(!t.groups.includes(r.group))add(pid,d,'warn',`${t.name} לא מיועד ל${GROUPS[r.group]}`);
      }
      if(r.group==='A'&&cl.c.includes('mc')&&cl.c.includes('nc')){cnt.shift-=2;cnt.duty++}
      if(r.group==='R'){const sh=cl.c.filter(c=>typeBy(c)?.kind==='shift').length;if(sh>=2){cnt.shift-=sh;cnt.duty++}else if(sh===1)add(pid,d,'warn','ברוטציה עושים במהלכים כירורגיה רק 24 שעות: בוקר וערב באותו יום')}
      if(cl.c.length&&cl.mk==='vac')add(pid,d,'err','שובץ ביום חופש');
      for(const code of cl.c){if(!typeBy(code))continue;const bh=blockHit(pid,iv(code,d),d,typeBy(code));if(bh)add(pid,d,'err',`שובץ בזמן שהמתמחה חסם (${bh})`)}
      if(cl.c.length&&cl.mk==='soft')add(pid,d,'warn','שובץ ביום שביקש שלא');
      if(cl.mk==='want'&&cl.wc&&cl.c.length&&!cl.c.some(c=>typeBy(c)&&wcMatch(cl.wc,typeBy(c))))add(pid,d,'warn',`ביקש ${wcName(cl.wc)}`);
    }
    {const nd=new Set(list.filter(x=>isNight(typeBy(x.code))).map(x=>x.d));for(const d of nd)if(nd.has(d-1)&&nd.has(d-2))add(pid,d,'warn','שלושה לילות ברצף')}
    list.sort((a,b)=>a.s-b.s);
    for(let i=1;i<list.length;i++){
      const a=list[i-1], b=list[i], gap=b.s-a.e;
      if(gap<0){add(pid,a.d,'err','חפיפה בין משמרות');add(pid,b.d,'err','חפיפה בין משמרות')}
      else if(gap===0&&a.d===b.d){if(b.e-a.s>st.maxCont*60){add(pid,b.d,'err',`רצף עבודה מעל ${st.maxCont} שעות`)}}
      else if(gap<st.minRest*60){add(pid,b.d,'warn',`מנוחה של ${Math.round(gap/60)} ש׳ בלבד לפני המשמרת`)}
    }
    per[pid]={cnt,tgt:targets(pid),list,frac:availFrac(pid)};
  }
  let missing=0, missList=[];
  for(let d=1;d<=N;d++)for(const t of S.types){const n=need(t.code,d);if(!n)continue;const f=filled(t.code,d).length;if(f<n){missing+=n-f;missList.push({d,code:t.code})}}
  const byLoc={};
  for(const pid of ids)for(let d=1;d<=N;d++)for(const code of cellOf(pid,d).c){const t=typeBy(code);if(!t||!t.loc)continue;(byLoc[t.loc]=byLoc[t.loc]||[]).push({pid,d,code,...iv(code,d)})}
  const clash=[];
  for(const loc in byLoc){const L=byLoc[loc].sort((a,b)=>a.s-b.s);
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length&&L[j].s<L[i].e;j++){const a=L[i],b=L[j];if(a.pid===b.pid)continue;
      const msg=`שני אנשים ב${loc} באותו זמן: ${pname(a.pid)} ו${pname(b.pid)}`;add(a.pid,a.d,'err',msg);add(b.pid,b.d,'err',msg);clash.push(b.d)}}
  const noSig=[];for(let d=1;d<=N;d++)if(sigDay(d)&&!signersOn(d).length)noSig.push(d);
  let errs=0,warns=0;for(const k in issues)issues[k].lvl==='err'?errs++:warns++;
  return{per,issues,missing,missList,errs,warns,noSig,clash};
}

/* ---------- evaluation (manual + auto) ---------- */
function buildCtx(){
  const ctx={occ:{},iv:{},cnt:{},tgt:{},days:{},frac:{},gs:{A:{mo:0,ni:0,wk:0,f:0},R:{mo:0,ni:0,wk:0,f:0},X:{mo:0,ni:0,wk:0,f:0}}};
  for(const pid of rosterIds()){
    ctx.iv[pid]=[];ctx.cnt[pid]={shift:0,duty:0,day:0,other:0,wk:0,mo:0,ni:0};ctx.frac[pid]=availFrac(pid);ctx.tgt[pid]=targets(pid);ctx.days[pid]=new Set();
    for(let d=1;d<=dim();d++){const cl=cellOf(pid,d);for(const code of cl.c){const t=typeBy(code);if(!t)continue;{const x=iv(code,d);ctx.iv[pid].push({d,...x,ni:isNight(t)});if(t.loc)(ctx.occ[t.loc]=ctx.occ[t.loc]||[]).push({pid,...x})}addUnits(ctx.cnt[pid],pid,t,d,1);if(isMorn(t))ctx.cnt[pid].mo++;if(isNight(t))ctx.cnt[pid].ni++;ctx.days[pid].add(d)}
      if(M().roster[pid].group==='A'&&cl.c.includes('mc')&&cl.c.includes('nc')){ctx.cnt[pid].shift-=2;ctx.cnt[pid].duty++}
      if(M().roster[pid].group==='R'){const sh=cl.c.filter(c=>typeBy(c)?.kind==='shift').length;if(sh>=2){ctx.cnt[pid].shift-=sh;ctx.cnt[pid].duty++}}
      if(cl.c.length&&isWeekend(d))ctx.cnt[pid].wk++}
    const g=ctx.gs[M().roster[pid].group],c=ctx.cnt[pid];g.mo+=c.mo;g.ni+=c.ni;g.wk+=c.wk;g.f+=ctx.frac[pid];
  }
  return ctx;
}
function evaluate(pid,t,d,ctx){
  const r=M().roster[pid], st=S.settings, why=[]; let hard=false, score=0;
  if(r.group==='X'){hard=true;why.push('לא זמין החודש')}
  if(!t.groups.includes(r.group)){hard=true;why.push('לא מתאים לקבוצה')}
  const cl0=cellOf(pid,d),mk=cl0.mk;
  if(mk==='vac'){hard=true;why.push('חופש')}
  {const bh=blockHit(pid,iv(t.code,d),d,t);if(bh){hard=true;why.push(`חסום: ${bh}`)}}
  if(ctx.days[pid].has(d)){hard=true;why.push('כבר משובץ ביום זה')}
  if(t.loc){const x0=iv(t.code,d);const o=(ctx.occ[t.loc]||[]).find(y=>y.pid!==pid&&x0.s<y.e&&y.s<x0.e);if(o){hard=true;why.push(`${t.loc} תפוס (${pname(o.pid)})`)}}
  const x=iv(t.code,d);
  for(const y of ctx.iv[pid]){
    if(x.s<y.e&&y.s<x.e){hard=true;why.push('חפיפה');break}
    const gap=x.s>=y.e?x.s-y.e:y.s-x.e;
    if(gap<st.minRest*60){hard=true;why.push(`מנוחה ${Math.round(gap/60)} ש׳`);break}
  }
  const c=ctx.cnt[pid], tg=ctx.tgt[pid];
  const U=units(pid,t,d);
  if(U&&U.shift){if(c.shift+U.shift>tg.S){hard=true;why.push(`משמרות ${c.shift}/${tg.S}`)}else score+=10*(tg.S-c.shift)/Math.max(tg.S,1)}
  else if(U&&U.duty){if(c.duty+U.duty>tg.D){hard=true;why.push(`תורנויות ${c.duty}/${tg.D}`)}else score+=10*(tg.D-c.duty)/Math.max(tg.D,1)}
  if(shabbatHit(pid,iv(t.code,d))){hard=true;why.push('לא עובד בשבת (כלל אישי)')}
  {const ru=rulesOf(pid);if(ru.shabbat&&r.group==='A'){const fri=isFriLike(d)&&isMorn(t)&&!isNight(t),mot=(wd(d)===6||dtype(d)==='hol')&&t.kind==='shift'&&isNight(t);
    if(fri||mot){const other=fri?d+1:d-1;const has=ctx.iv[pid].some(y=>y.d===other);score+=has?8:2;if(has)why.push('משלים סופ״ש')}}}
  if(!U)score-=0.6*c[t.kind];
  {const tn=isNight(t);let adj=0;for(const y of ctx.iv[pid]){const dd=Math.abs(y.d-d);if(dd===0||dd>2)continue;if(tn&&y.ni){if(dd===1){score-=7;adj++}else score-=3}else if(dd===1)score-=1.5}if(adj)why.push('לילה צמוד ללילה אחר')}
  if(t.kind==='day'){const h=homeOf(pid);if(h===t.code){score+=15;why.push('הבוקר הקבוע שלו')}else if(h===''&&t.code==='b'){score-=6+3*c.day;if(isICU(pid)){score-=10;why.push('ב־ICU, עדיף שלא')}if(c.day)why.push(`כבר מילא ${c.day} בקרים`)}}
  if(wkndMorning(t,d)&&!cl0.c.includes('v')){hard=true;why.push('בסופ״ש בוקר צד ב עושה התורן')}
  if(sigReqOn(t,d)&&!isSigner(pid)){hard=true;why.push('ביום הזה נדרש חותם שחרור')}
  if(t.internal){if(isSigner(pid)){if(t.forSigners){score+=6;why.push('חותם, עדיף במהלכים')}else score-=6}else if(t.forSigners)score-=4}
  if(!qualified(pid,t)){hard=true;why.push(`לא מאושר ל${t.name}`)}
  if(t.signer&&isSigner(pid))why.push('חותם שחרור');
  if(mk==='soft'){score-=8;why.push('ביקש שלא')}
  if(mk==='want'){if(wcMatch(cl0.wc,t)){score+=cl0.wc?10:6;why.push('ביקש לעבוד')}else{score+=0.5;why.push(`ביקש ${wcName(cl0.wc)}`)}}
  const p=(r.pref||{})[t.code];
  if(p===1){score+=4;why.push('מעדיף')} if(p===-1){score-=9;why.push('לא מעדיף')}
  const G=ctx.gs[r.group],fr=ctx.frac[pid],dev=k=>c[k]-(G.f?G[k]/G.f:0)*fr;
  if(isMorn(t))score-=2.5*dev('mo');
  if(isNight(t))score-=2.5*dev('ni');
  if(isWeekend(d)&&!ctx.days[pid].has(d)){score-=4*dev('wk');if(c.wk)why.push(`${c.wk} סופ״ש/חג`)}
  return{hard,why,score};
}
function commit(ctx,pid,t,d){const x=iv(t.code,d),c=ctx.cnt[pid],G=ctx.gs[M().roster[pid].group];ctx.iv[pid].push({d,...x,ni:isNight(t)});if(t.loc)(ctx.occ[t.loc]=ctx.occ[t.loc]||[]).push({pid,...x});addUnits(c,pid,t,d,1);if(isMorn(t)){c.mo++;G.mo++}if(isNight(t)){c.ni++;G.ni++}if(isWeekend(d)&&!ctx.days[pid].has(d)){c.wk++;G.wk++}ctx.days[pid].add(d)}

function uncommit(ctx,pid,t,d){const x=iv(t.code,d),c=ctx.cnt[pid],G=ctx.gs[M().roster[pid].group];
  const i=ctx.iv[pid].findIndex(y=>y.d===d&&y.s===x.s&&y.e===x.e);if(i>=0)ctx.iv[pid].splice(i,1);addUnits(c,pid,t,d,-1);if(isMorn(t)){c.mo--;G.mo--}if(isNight(t)){c.ni--;G.ni--}
  if(t.loc&&ctx.occ[t.loc]){const j=ctx.occ[t.loc].findIndex(y=>y.pid===pid&&y.s===x.s);if(j>=0)ctx.occ[t.loc].splice(j,1)}
  if(!ctx.iv[pid].some(y=>y.d===d)){ctx.days[pid].delete(d);if(isWeekend(d)){c.wk--;G.wk--}}}
function can24(pid,d,ctx,mcT,ncT,ignorePid){
  const r=M().roster[pid],st=S.settings;if(!r||(r.group!=='A'&&r.group!=='R'))return null;
  if(!mcT.groups.includes(r.group)||!ncT.groups.includes(r.group)||!qualified(pid,mcT)||!qualified(pid,ncT))return null;
  const cl=cellOf(pid,d);if(cl.mk==='vac')return null;
  const a=iv('mc',d),b=iv('nc',d);if(blockHit(pid,a,d,mcT)||blockHit(pid,b,d,ncT))return null;
  if(ctx.days[pid].has(d))return null;
  for(const y of ctx.iv[pid]){const gap=a.s>=y.e?a.s-y.e:y.s-b.e;if(gap<st.minRest*60)return null}
  if(b.e-a.s>st.maxCont*60)return null;
  for(const[t,x] of [[mcT,a],[ncT,b]])if(t.loc&&(ctx.occ[t.loc]||[]).some(y=>y.pid!==pid&&y.pid!==ignorePid&&x.s<y.e&&y.s<x.e))return null;
  if(sigReqOn(ncT,d)&&!isSigner(pid))return null;
  if(shabbatHit(pid,{s:a.s,e:b.e}))return null;
  const c=ctx.cnt[pid],tg=ctx.tgt[pid];if(c.duty>=tg.D)return null;
  let sc=10*(tg.D-c.duty)/Math.max(tg.D,1)+Math.random()*2;const p=(r.pref||{});if(p.mc===1||p.nc===1)sc+=4;if(p.mc===-1||p.nc===-1)sc-=8;
  if(cl.mk==='soft')sc-=8;if(cl.mk==='want'&&(!cl.wc||cl.wc==='@duty'||cl.wc==='mc'||cl.wc==='nc'))sc+=6;
  if(r.group==='A')sc-=1;return sc}
function autofill(){
  const N=dim(), ids=rosterIds(), sigs=new Set(ids.filter(isSigner));
  const slots=[];
  for(let d=1;d<=N;d++)for(const t of S.types){const n=need(t.code,d);const f=filled(t.code,d).length;for(let k=f;k<n;k++)slots.push({d,t})}
  const intTypes=S.types.filter(t=>t.internal), extraTypes=S.types.filter(t=>t.extra);
  const intMin=S.settings.intMin||0, intHave=internalCount();
  const kindRank={duty:0,shift:1,day:2,other:3};
  const pickBest=(t,d,ctx,bonusSig)=>{let top=null,ts=-1e9,topSig=null,tss=-1e9;
    for(const pid of ids){const e=evaluate(pid,t,d,ctx);if(e.hard)continue;let sc=e.score+Math.random()*2.2;
      if(bonusSig&&sigs.has(pid)){sc+=12;if(sc>tss){tss=sc;topSig=pid}}
      if(sc>ts){ts=sc;top=pid}}return{top,topSig}};
  let best=null;
  for(let trial=0;trial<140;trial++){
    const ctx=buildCtx(); const picks=[]; let unfilled=0; const left=[];
    const has=new Set();for(let d=1;d<=N;d++)for(const t of S.types)if(filled(t.code,d).length)has.add(t.code+'|'+d);
    const put=(pid,t,d)=>{commit(ctx,pid,t,d);picks.push({pid,d,code:t.code});has.add(t.code+'|'+d);if(t.signer&&sigs.has(pid))covered.add(d)};
    const covered=new Set(), remSig={};for(let d=1;d<=N;d++)if(!sigDay(d)||signersOn(d).length)covered.add(d);
    // שלב 1: משבצות חובה
    const order=slots.map(s=>({...s,r:Math.random()})).sort((a,b)=>((a.t.late?1:0)-(b.t.late?1:0))||(sigReqOn(b.t,b.d)-sigReqOn(a.t,a.d))||((isWeekend(a.d)?0:1)-(isWeekend(b.d)?0:1))||(kindRank[a.t.kind]-kindRank[b.t.kind])||(a.r-b.r));
    for(const s of order)if(s.t.signer)remSig[s.d]=(remSig[s.d]||0)+1;
    for(const s of order){
      const needSig=s.t.signer&&!covered.has(s.d);
      let{top,topSig}=pickBest(s.t,s.d,ctx,needSig);
      if(needSig){remSig[s.d]--;if(remSig[s.d]<=0&&topSig)top=topSig}
      if(top)put(top,s.t,s.d);else{unfilled++;left.push(s)}
    }
    // שלב 1ב: בוקר מהלכים כירורגיה שנשאר ריק הופך ל־24 שעות (בוקר+ערב) כתורנות
    const mcT=typeBy('mc'),ncT=typeBy('nc');
    if(mcT&&ncT&&S.settings.surg24!==false){
      for(const s of left.filter(x=>x.t.code==='mc').sort(()=>Math.random()-.5)){
        const d=s.d;if(has.has('mc|'+d))continue;
        const ncPick=picks.find(p=>p.d===d&&p.code==='nc');const ncManual=!ncPick&&filled('nc',d).length;if(ncManual)continue;
        let bestP=null,bs=-1e9;for(const pid of ids){const sc=can24(pid,d,ctx,mcT,ncT,ncPick&&ncPick.pid);if(sc!==null&&sc>bs){bs=sc;bestP=pid}}
        if(!bestP)continue;
        if(ncPick){uncommit(ctx,ncPick.pid,ncT,d);picks.splice(picks.indexOf(ncPick),1)}
        put(bestP,mcT,d);put(bestP,ncT,d);ctx.cnt[bestP].shift-=2;ctx.cnt[bestP].duty++;unfilled--;left.splice(left.indexOf(s),1);
      }
      // ניסיון חוזר למשבצות שנשארו ריקות, עם מי שהתפנה
      for(const s of [...left]){if(has.has(s.t.code+'|'+s.d))continue;const{top}=pickBest(s.t,s.d,ctx,false);if(top){put(top,s.t,s.d);unfilled--;left.splice(left.indexOf(s),1)}}
    }
    // שלב 2: מכסת פנימית
    let intN=intHave;
    if(intTypes.length&&intN<intMin){
      const days=[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
      for(let pass=0;pass<2&&intN<intMin;pass++)for(const d of days){if(intN>=intMin)break;
        if(pass===0&&intTypes.some(t=>has.has(t.code+'|'+d)))continue;
        let bp=null,bt=null,bs=-1e9;
        for(const t of intTypes){if(has.has(t.code+'|'+d))continue;const needSig=t.signer&&!covered.has(d);
          for(const pid of ids){const e=evaluate(pid,t,d,ctx);if(e.hard)continue;let sc=e.score+Math.random()*2.2;if(needSig&&sigs.has(pid))sc+=12;if(sc>bs){bs=sc;bp=pid;bt=t}}}
        if(bp){put(bp,bt,d);intN++}}
    }
    // שלב 4 מוגדר אחרי שלב 3
    // שלב 3: השלמת מכסת התורנויות של כל מתמחה בטיפול נמרץ, אורתופדיה וילדים
    for(let round=0;round<12;round++){let any=false;
      for(const pid of [...ids].sort(()=>Math.random()-.5)){
        if(M().roster[pid].group==='X'||ctx.cnt[pid].duty>=ctx.tgt[pid].D)continue;
        let bt=null,bd=0,bs=-1e9;
        const days=[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5).slice(0,14);
        for(const d of days)for(const t of extraTypes){if(has.has(t.code+'|'+d))continue;const e=evaluate(pid,t,d,ctx);if(e.hard)continue;const sc=e.score+Math.random();if(sc>bs){bs=sc;bt=t;bd=d}}
        if(bt){put(pid,bt,bd);any=true}}
      if(!any)break}
    // שלב 4: השלמת משמרות לאגף א: קודם בוקר מהלכים כירורגיה, אחר כך בוקר אורתופדיה או מד״א
    const fillT=S.types.filter(t=>t.filler);
    if(fillT.length)for(const pid of ids.filter(p=>M().roster[p].group==='A').sort(()=>Math.random()-.5)){
      let def=ctx.tgt[pid].S-ctx.cnt[pid].shift;
      while(def>0){let bt=null,bd=0,bs=-1e9;
        for(let d=1;d<=N;d++){if(isWeekend(d))continue;for(const [fi,t] of fillT.entries()){if(has.has(t.code+'|'+d))continue;const e=evaluate(pid,t,d,ctx);if(e.hard)continue;const sc=e.score+Math.random()+3*(fillT.length-fi);if(sc>bs){bs=sc;bt=t;bd=d}}}
        if(!bt)break;put(pid,bt,bd);def--}
    }
    let cost=unfilled*1000+Math.max(0,intMin-intN)*400;for(let d=1;d<=N;d++)if(!covered.has(d))cost+=500;
    for(const pid of ids){const c=ctx.cnt[pid],tg=ctx.tgt[pid],g=M().roster[pid].group;cost+=8*((tg.S-c.shift)**2+(tg.D-c.duty)**2);
      if(g==='X')continue;const G=ctx.gs[g],fr=ctx.frac[pid];for(const [k,wt] of [['mo',3],['ni',3],['wk',6]]){const e=G.f?G[k]/G.f*fr:0;cost+=wt*(c[k]-e)**2}}
    for(const pid of ids){const nd=new Set(ctx.iv[pid].filter(y=>y.ni).map(y=>y.d));for(const d of nd)if(nd.has(d+1))cost+=6}
    for(const pid of ids){if(!rulesOf(pid).shabbat||M().roster[pid].group!=='A')continue;const ds=new Set(ctx.iv[pid].map(y=>y.d));
      for(let d=1;d<=N;d++){if(d+1>N||!(isFriLike(d)&&(wd(d+1)===6||dtype(d+1)==='hol')))continue;const a=ds.has(d),b=ds.has(d+1);if(a!==b)cost+=25}}
    {const fb=ids.filter(p=>M().roster[p].group==='R'&&!homeOf(p)&&!isICU(p));const mean=fb.reduce((a,p)=>a+ctx.cnt[p].day,0)/Math.max(fb.length,1);for(const p of fb)cost+=4*(ctx.cnt[p].day-mean)**2;
     for(const p of ids)if(isICU(p)&&!homeOf(p))cost+=8*ctx.cnt[p].day}
    for(const p of picks){if((M().roster[p.pid].pref||{})[p.code]===-1)cost+=5;if(cellOf(p.pid,p.d).mk==='soft')cost+=6}
    if(!best||cost<best.cost)best={cost,picks,unfilled,noSig:N-covered.size,intN};
  }
  if(!best.picks.length){toast('אין מה להוסיף: משבצות החובה מאוישות ואין מתמחה עם מכסה פנויה');return}
  pushUndo();
  for(const p of best.picks){const cl=cellOf(p.pid,p.d);setCell(p.pid,p.d,{c:[...cl.c,p.code],mk:cl.mk})}
  save();render();
  const msg=[`שובצו ${best.picks.length} משבצות`];
  if(best.unfilled)msg.push(`${best.unfilled} משבצות חובה נשארו ריקות`);
  if(intMin&&best.intN<intMin)msg.push(`פנימית ${best.intN} מתוך ${intMin}`);
  if(best.noSig)msg.push(`ב־${best.noSig} לילות אין חותם שחרור`);
  toast(msg.join('. '),5000);
}

function statCell(v,t,na){if(na)return`<td class="stat na">–</td>`;const cls=v<t?'under':v>t?'over':'done';return`<td class="stat ${cls}" title="שובצו ${v} מתוך יעד ${t}">${v}/${t}</td>`}
function groupBal(A,g){const ids=rosterIds().filter(p=>M().roster[p].group===g);let f=0,t={mo:0,ni:0,wk:0};for(const p of ids){const c=A.per[p].cnt;f+=A.per[p].frac;t.mo+=c.mo;t.ni+=c.ni;t.wk+=c.wk.size}return{ids,f,t}}
function balCell(v,pid,k,A,label){const g=M().roster[pid].group;if(g==='X')return`<td class="stat na">${v||'–'}</td>`;
  A._gb=A._gb||{};const B=A._gb[g]||(A._gb[g]=groupBal(A,g));const e=B.f?B.t[k]/B.f*A.per[pid].frac:0;const dv=v-e;
  const cls=dv>=1.5?'hi':dv<=-1.5?'lo':'';return`<td class="stat num ${cls}" title="${label}: ${v}, הצפי לפי הקבוצה וימי החופש: ${e.toFixed(1)}">${v}</td>`}
function balSummary(A){let h='';for(const g of ['A','R']){const B=groupBal(A,g);if(!B.ids.length)continue;
  const rng=k=>{const vs=B.ids.map(p=>k==='wk'?A.per[p].cnt.wk.size:A.per[p].cnt[k]);return Math.min(...vs)===Math.max(...vs)?`${vs[0]}`:`${Math.min(...vs)}–${Math.max(...vs)}`};
  h+=`<span class="pill" title="טווח בין המתמחים בקבוצה">${GROUPS[g]}: בקרים ${rng('mo')}, לילות ${rng('ni')}, סופ״ש ${rng('wk')}</span>`}return h}
function occName(t,d,pid){if(!t.loc)return'';const x=iv(t.code,d);const who=new Set();
  for(const q of rosterIds()){if(q===pid)continue;for(const dd of [d-1,d,d+1]){if(dd<1||dd>dim())continue;for(const c of cellOf(q,dd).c){const u=typeBy(c);if(!u||u.loc!==t.loc)continue;const y=iv(c,dd);if(x.s<y.e&&y.s<x.e)who.add(pname(q))}}}
  return[...who].join(', ')}

function planLabelToGroup(l){l=norm(l);if(!l)return null;if(/מלר.?ד|אגף\s*א/.test(l)&&!/ב\s*\+\s*ג/.test(l))return{g:'A',rot:'אגף א'};if(/מילואים|שלב\s*ב|לא\s*פעיל|חל.?ד|חופשת\s*לידה/.test(l))return{g:'X',rot:l};return{g:'R',rot:l}}
function applyPlan(key){const mo=S.months[key];if(!mo||!S.rotPlan)return 0;let n=0;
  for(const pid in S.rotPlan){const G=planLabelToGroup((S.rotPlan[pid]||{})[key]);if(!G||!person(pid))continue;let r=mo.roster[pid];
    if(!r){mo.roster[pid]=blankRoster(G.g,G.rot,'',Object.keys(mo.roster).length+1);n++;continue}
    if(r.group!==G.g||r.rot!==G.rot){r.group=G.g;r.rot=G.rot;n++}}return n}
function planMonths(){const n=new Date(),set=new Set(Object.keys(S.months));for(const pid in (S.rotPlan||{}))for(const k in S.rotPlan[pid])set.add(k);for(let i=0;i<4;i++){const dt=new Date(n.getFullYear(),n.getMonth()+i,1);set.add(`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}`)}return[...set].sort().slice(-8)}
function nameKey(x){return norm(x).replace(/["'׳״`\-־.]/g,'').replace(/\s+/g,'')}
function ensurePlanNames(){const n=new Date(),nowKey=`${n.getFullYear()}-${pad2(n.getMonth()+1)}`;S.rotPlan=S.rotPlan||{};
  for(const k in S.months){if(k<nowKey)continue;for(const pid in S.months[k].roster)if(person(pid)&&!S.rotPlan[pid])S.rotPlan[pid]={}}}
function personData(pid){let n=0;for(const k in S.months){const mo=S.months[k];if(mo.roster[pid]&&(mo.roster[pid].reqAt||mo.roster[pid].notes))n+=5;for(const c in mo.cells)if(c.startsWith(pid+'|'))n++}if(S.rotPlan&&S.rotPlan[pid])n+=Object.keys(S.rotPlan[pid]).length;return n}
function findDups(){const g={};for(const p of S.people){const k=nameKey(p.name);if(!k)continue;(g[k]=g[k]||[]).push(p)}
  const out=Object.values(g).filter(a=>a.length>1).map(a=>({sure:true,list:a}));
  const keys=Object.keys(g);for(let i=0;i<keys.length;i++)for(let j=0;j<keys.length;j++){if(i===j)continue;const a=keys[i],b=keys[j];if(a.length>=3&&b.length>a.length&&b.startsWith(a))out.push({sure:false,list:[...g[a],...g[b]]})}
  return out}
function mergePeople(keepId,dropId){if(keepId===dropId)return;

    <td><input type="time" data-tf="start" value="${t.start}"></td><td><input type="time" data-tf="end" value="${t.end}"></td>

    <td><div class="wdbox">${WD.map((w,j)=>`<label>${w}<input type="checkbox" data-tn="${j}" ${t.need[j]?'checked':''}></label>`).join('')}</div></td>

    <td><select data-tf="color" class="c-${t.color}" style="background:var(--cb);color:var(--cf)">${Object.entries(COLORS).map(([k,v])=>`<option value="${k}" ${t.color===k?'selected':''}>${v}</option>`).join('')}</select></td>
    <td><button class="btn small danger" data-tdel="${i}">מחק</button></td></tr>`;
  });
  h+=`</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn" id="bAddT">הוסף סוג משמרת</button><button class="btn" id="bResetT">החזר ברירת מחדל</button></div></div>`;
  h+=`<div class="panel"><h2>חגים</h2><p class="hint">חגי ישראל נסמנים אוטומטית בכל חודש חדש: ראש השנה, יום כיפור, סוכות, שמחת תורה, פסח, שביעי של פסח ושבועות. חג נחשב כמו שבת וערב חג כמו שישי, כלומר שניהם נספרים כסופ״ש. ימים נוספים (למשל יום העצמאות) מסמנים בלחיצה על התאריך בלוח.</p>

/* ---------- sheets ---------- */
function openSheet(html,onClose){
  const layer=$('#layer');
  layer.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=layer.firstChild;
  const close=()=>{layer.innerHTML='';document.removeEventListener('keydown',kd);onClose&&onClose()};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))close()});
  setTimeout(()=>{const f=ov.querySelector('button,input,select');f&&f.focus()},30);
  return{el:ov.firstChild,close};
}
function cellSheet(pid,d){
  const r=M().roster[pid], before0=JSON.stringify(cellOf(pid,d).c), wasFinal=!!M().final;
  const draw=()=>{
    const cl=cellOf(pid,d), is=analyze().issues[pid+'|'+d];
    const elig=S.types.filter(t=>t.groups.includes(r.group)), other=S.types.filter(t=>!t.groups.includes(r.group));
    const optBtn=t=>`<button class="opt ${elig.includes(t)?'':'dim'}" data-code="${t.code}" aria-pressed="${cl.c.includes(t.code)}"><span class="chip c-${t.color}">${esc(t.short)}</span>${esc(t.name)}${occName(t,d,pid)?` <small style="color:var(--muted)">(${esc(occName(t,d,pid))})</small>`:''}</button>`;
    let h=`<h3>${esc(pname(pid))}</h3><p class="sub">${fmtDate(d)}, ${GROUPS[r.group]}${r.group==='R'&&r.rot?' ('+esc(r.rot)+')':''}</p>${wasFinal?'<p class="sub" style="color:var(--warn);font-weight:600">הלוח אושר סופית. שינוי כאן יירשם ביומן השינויים.</p>':''}`;
    h+=`<h4>שיבוץ</h4><div class="opts">${elig.map(optBtn).join('')}</div>`;
    if(other.length)h+=`<details style="margin-top:8px"><summary style="color:var(--muted);font-size:13px;cursor:pointer">משמרות של קבוצה אחרת</summary><div class="opts" style="margin-top:6px">${other.map(optBtn).join('')}</div></details>`;
    h+=`<h4>סימון</h4><div class="opts">${Object.entries(MARKS).map(([k,v])=>`<button class="opt" data-mk="${k}" aria-pressed="${(cl.mk||'')===k}">${v}</button>`).join('')}</div>`;
    if(cl.mk==='off'&&r.group==='A')h+=`<h4>מה חסום</h4><div class="opts">${Object.entries(PARTS).map(([k,v])=>`<button class="opt" data-part="${k}" aria-pressed="${(cl.part||'')===k}">${v}</button>`).join('')}</div>`;
    if(cl.mk==='want')h+=`<h4>איזו משמרת ביקש</h4><div class="opts"><button class="opt" data-wc="" aria-pressed="${!cl.wc}">כל משמרת</button>${Object.entries(WCAT).map(([k,v])=>`<button class="opt" data-wc="${k}" aria-pressed="${cl.wc===k}">${v}</button>`).join('')}${elig.map(t=>`<button class="opt" data-wc="${t.code}" aria-pressed="${cl.wc===t.code}"><span class="chip c-${t.color}">${esc(t.short)}</span>${esc(t.name)}</button>`).join('')}</div>`;
    if(is)h+=`<ul class="issues">${is.msgs.map(m=>`<li class="${is.lvl}">${esc(m)}</li>`).join('')}</ul>`;
    if(r.notes)h+=`<h4>בקשות המתמחה</h4><div class="note">${esc(r.notes)}</div>`;
    h+=`<div class="foot"><button class="btn primary" data-close>סיום</button><button class="btn" data-clearcell>נקה תא</button></div>`;
    return h;
  };
  const sh=openSheet(draw(),()=>{const now=JSON.stringify(cellOf(pid,d).c);if(wasFinal&&now!==before0){addLog(S.cur,`עריכה ידנית: ${pname(pid)} ב־${d}: ${JSON.parse(before0).map(c=>typeBy(c)?.short||c).join('+')||'ריק'} ← ${cellOf(pid,d).c.map(c=>typeBy(c)?.short||c).join('+')||'ריק'}`);save()}render()});
  sh.el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const cl=cellOf(pid,d);
    if(b.dataset.code){pushUndo();const c=b.dataset.code;const arr=cl.c.includes(c)?cl.c.filter(x=>x!==c):[...cl.c,c];setCell(pid,d,{c:arr,mk:cl.mk})}
    else if(b.dataset.mk!==undefined){pushUndo();setCell(pid,d,{c:cl.c,mk:b.dataset.mk})}
    else if(b.dataset.part!==undefined){pushUndo();setCell(pid,d,{c:cl.c,mk:'off',part:b.dataset.part})}
    else if(b.dataset.wc!==undefined){pushUndo();setCell(pid,d,{c:cl.c,mk:'want',wc:b.dataset.wc})}
    else if(b.hasAttribute('data-clearcell')){pushUndo();setCell(pid,d,{c:[],mk:''})}
    else return;
    save();sh.el.innerHTML=draw();renderGrid();
  });
}
function covSheet(code,d){
  const wasFinal=!!M().final, snapDay=()=>rosterIds().filter(p=>cellOf(p,d).c.includes(code)).map(pname).join(', '), before0=snapDay();
  const t=typeBy(code);
  const draw=()=>{
    const f=filled(code,d), n=need(code,d), ov=M().needOv[code+'|'+d];
    const ctx=buildCtx();
    let h=`<h3>${esc(t.name)}</h3><p class="sub">${fmtDate(d)}, ${t.start}–${t.end}</p>`;
    h+=`<div class="row"><button class="opt" data-need="1" aria-pressed="${n===1}">נדרש</button><button class="opt" data-need="0" aria-pressed="${n===0}">לא נדרש ביום זה</button>${ov!==undefined?`<button class="btn small" data-need="reset">חזור לברירת המחדל</button>`:''}</div>`;
    h+=`<h4>משובצים</h4>`;
    h+=f.length?`<div class="opts">${f.map(pid=>`<button class="opt" data-rm="${pid}" aria-label="הסר את ${esc(pname(pid))}">${esc(pname(pid))} <span aria-hidden="true">✕</span></button>`).join('')}</div>`:`<p class="sub" style="margin:0">אין עדיין. בחרו מהרשימה.</p>`;
    const rows=rosterIds().filter(pid=>!f.includes(pid)&&M().roster[pid].group!=='X').map(pid=>({pid,...evaluate(pid,t,d,ctx)})).sort((a,b)=>(a.hard-b.hard)||(b.score-a.score));
    h+=`<h4>מועמדים</h4><div class="cands">${rows.map(x=>`<div class="cand ${x.hard?'blocked':''}"><span class="who">${esc(pname(x.pid))}</span><span class="why">${esc(x.why.join(', ')||'פנוי')}</span><button class="btn small ${x.hard?'':'primary'}" data-add="${x.pid}">שבץ</button></div>`).join('')}</div>`;
    h+=`<div class="foot"><button class="btn" data-close>סגור</button></div>`;
    return h;
  };
  const sh=openSheet(draw(),()=>{const now=snapDay();if(wasFinal&&now!==before0){addLog(S.cur,`עריכה ידנית: ${typeBy(code)?.name||code} ב־${d}: ${before0||'ריק'} ← ${now||'ריק'}`);save()}render()});
  sh.el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.add){pushUndo();const cl=cellOf(b.dataset.add,d);setCell(b.dataset.add,d,{c:[...cl.c,code],mk:cl.mk})}
    else if(b.dataset.rm){pushUndo();const cl=cellOf(b.dataset.rm,d);setCell(b.dataset.rm,d,{c:cl.c.filter(x=>x!==code),mk:cl.mk})}
    else if(b.dataset.need!==undefined){pushUndo();const k=code+'|'+d;if(b.dataset.need==='reset')delete M().needOv[k];else M().needOv[k]=Number(b.dataset.need)}
    else return;
    save();sh.el.innerHTML=draw();renderGrid();
  });
}
function newMonthSheet(){
  const[y,m]=ym(); const nm=m===12?1:m+1, ny=m===12?y+1:y;
  const h=`<h3>חודש חדש</h3><p class="sub">רשימת המתמחים וההעדפות מועתקות מ${HEB_MONTHS[m-1]}. הלוח, ימי החופש וההערות מתחילים ריקים.</p>
  <div class="row"><select id="nmM">${HEB_MONTHS.map((x,i)=>`<option value="${i+1}" ${i+1===nm?'selected':''}>${x}</option>`).join('')}</select><input id="nmY" type="number" value="${ny}" style="width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:5px"></div>
  <p class="sub" style="margin-top:10px">שנו את הקבוצה של מי שעובר סבב בלשונית "מתמחים וסבבים", וסמנו חגים בלחיצה על התאריך.</p>
  <div class="foot"><button class="btn primary" id="nmGo">צור חודש</button><button class="btn" data-close>ביטול</button></div>`;
  const sh=openSheet(h);
  sh.el.querySelector('#nmGo').onclick=()=>{
    const key=`${sh.el.querySelector('#nmY').value}-${String(sh.el.querySelector('#nmM').value).padStart(2,'0')}`;
    if(S.months[key]&&!confirm('החודש כבר קיים. לעבור אליו?'))return;
    if(!S.months[key]){const src=M().roster, roster={};for(const id in src){const r=src[id];roster[id]={...blankRoster(r.group,r.rot,'',r.order),pref:{...(r.pref||{})}}}
      S.months[key]={roster,cells:{},dayTypes:autoTypes(key),autoHol:1,needOv:{}};applyPlan(key)}
    S.cur=key;undoStack=[];$('#bUndo').disabled=true;save();sh.close();render();
  };
}

function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('ספריית האקסל לא נטענה. בדקו חיבור לאינטרנט');return}
  const N=dim(),[y,m]=ym(),ids=rosterIds(),A=analyze();
  const codes=S.types.map(t=>t.code);
  const r1=[HEB_MONTHS[m-1]];for(let d=1;d<=N;d++)r1.push(d);r1.push('סבב','בקשות','משמרות','תורנויות','סופ"ש',...codes);
  const r2=[y];for(let d=1;d<=N;d++)r2.push(WD[wd(d)]);
  const req=[r1,r2];

    const reasons=new Set();let vac=0,want=0;

      if(parts.length){cells[k]={c:[],mk:'off'};if(g==='A'&&parts.length===1)cells[k].part=parts[0];continue}

function loadRQ(keep){
  const mo=S.months[RQ.m], p=findPerson(RQ.name);
  const clear=()=>{RQ.b=new Set();RQ.s=new Set();RQ.w=new Map()};
  if(!mo||!p||!mo.roster[p.id]){if(!keep)clear();return}
  const r=mo.roster[p.id], bp=new Map(), b=new Set(), s=new Set(), w=new Map();
  if(r.group==='A'||r.group==='R'){RQ.g=r.group;RQ.rot=r.group==='R'?r.rot:''}
  for(let d=1;d<=kDim(RQ.m);d++){const cl=mo.cells[p.id+'|'+d];if(!cl)continue;
    if(cl.mk==='off'){b.add(d);if(cl.part)bp.set(d,cl.part)}else if(cl.mk==='soft')s.add(d);else if(cl.mk==='want')w.set(d,cl.wc||'')}
  if(keep&&!b.size&&!s.size&&!w.size&&!r.reqAt)return;
  RQ.b=b;RQ.bp=bp;RQ.s=s;RQ.w=w;RQ.t=r.notes||'';
}

function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function b64d(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function rqUnits(){return[...RQ.b].flatMap(d=>RQ.g==='A'&&!(RQ.bp&&RQ.bp.get(d))?[d,d]:[d])}
function buildReq(){const bp=[...RQ.b].filter(d=>RQ.bp&&RQ.bp.get(d)).map(d=>[d,RQ.bp.get(d)]);return{v:1,m:RQ.m,n:norm(RQ.name),g:RQ.g,r:norm(RQ.rot),bp,bu:[...RQ.b].flatMap(d=>RQ.g==='A'&&!(RQ.bp&&RQ.bp.get(d))?[d,d]:[d]),b:[...RQ.b].sort((a,b)=>a-b),s:[...RQ.s].sort((a,b)=>a-b),w:[...RQ.w].sort((a,b)=>a[0]-b[0]),t:RQ.t.trim(),ts:Date.now()}}
function reqMessage(q){
  const L=[`בקשות משמרות ל${kLabel(q.m)}`,`שם: ${q.n} (${q.g==='A'?'אגף א':'רוטציה'+(q.r?' '+q.r:'')})`,`חסימות (${q.b.length}): ${q.b.join(', ')||'אין'}`];
  if(q.s.length)L.push(`מעדיף שלא: ${q.s.join(', ')}`);
  if(q.w.length)L.push(`רוצה לעבוד: ${q.w.map(([d,c])=>c?`${d} (${typeBy(c)?.name||c})`:String(d)).join(', ')}`);
  if(q.t)L.push(`הערות: ${q.t}`);
  L.push('','#REQ:'+b64e(q));
  return L.join('\n');
}
function validRQ(){
  if(!norm(RQ.name)){toast('כתבו את השם שלכם');$('#rqName')&&$('#rqName').focus();return false}
  const chk=checkBlocks(RQ.m,RQ.g,rqUnits());
  if(chk.errs.length){toast('יש לתקן: '+chk.errs.join(', '),4000);return false}
  return true;
}
function applyRequest(q){
  const mo=ensureMonth(q.m); let p=findPerson(q.n)||matchName(q.n), isNew=false;
  if(!p){p={id:uid(),name:norm(q.n)};S.people.push(p);isNew=true}
  if(!mo.roster[p.id])mo.roster[p.id]=blankRoster(q.g,q.g==='A'?'אגף א':(q.r||''),'',Object.keys(mo.roster).length+1);
  const r=mo.roster[p.id];
  if(r.group==='X'&&/מילואים/.test(r.rot||'')&&(q.g==='A'||q.g==='R')){r.group=q.g;r.rot=q.g==='A'?'אגף א':(q.r||'')}
  if(r.group==='R'&&!r.rot&&q.r)r.rot=q.r;
  r.notes=q.t||''; r.reqAt=q.ts||Date.now(); r.reqG=q.g;
  const N=kDim(q.m);
  const clr=Array.isArray(q.vac)?['off','soft','want','vac']:['off','soft','want'];if(Array.isArray(q.vac))r.vacBy=q.vby||'';
  for(let d=1;d<=N;d++){const k=p.id+'|'+d,cl=mo.cells[k];if(cl&&clr.includes(cl.mk)){cl.mk='';delete cl.wc;if(!cl.c.length)delete mo.cells[k]}}
  const put=(d,mk,wc,part)=>{d=Number(d);if(!(d>=1&&d<=N))return;const k=p.id+'|'+d,cl=mo.cells[k]||{c:[],mk:''};cl.mk=mk;if(wc)cl.wc=wc;else delete cl.wc;if(part)cl.part=part;else delete cl.part;mo.cells[k]=cl};
  const bpm=new Map(q.bp||[]);
  (q.vac||[]).forEach(d=>put(d,'vac'));(q.b||[]).forEach(d=>put(d,'off','',q.g==='A'?bpm.get(d):''));(q.s||[]).forEach(d=>put(d,'soft'));(q.w||[]).forEach(([d,c])=>put(d,'want',c));
  return{p,isNew,mismatch:(r.group==='A'||r.group==='R')&&r.group!==q.g};
}

function addLog(key,text){const mo=S.months[key];if(!mo)return;(mo.log=mo.log||[]).push({ts:Date.now(),text})}
function ingest(txt){
  const found=[...txt.matchAll(/#(REQ|CHG):([A-Za-z0-9+/=]+)/g)];
  if(!found.length){toast('לא נמצא קוד #REQ או #CHG בטקסט שהודבק',4000);return}
  const list=[];let bad=0;
  for(const f of found){try{const q=b64d(f[2]);q.type=f[1]==='CHG'?'chg':'req';list.push(q)}catch(e){bad++}}
  $('#inPaste')&&($('#inPaste').value='');
  ingestQs(list,bad);
}
function ingestQs(list,bad=0){
  const applied=[],queued=[];let undone=false;
  const queue=q=>{const i=S.pending.findIndex(x=>x.type===q.type&&x.m===q.m&&norm(x.n)===norm(q.n)&&(q.type==='req'||(x.d1===q.d1&&x.c1===q.c1)));
    if(i>=0){if((S.pending[i].ts||0)<=(q.ts||0))S.pending[i]=q}else S.pending.push(q);queued.push(q)};
  list.sort((a,b)=>(a.ts||0)-(b.ts||0));
  for(const q of list){
    if(q.type==='chg'){if(!q||!q.m||!q.n||!q.w||!q.d1||!q.c1){bad++;continue}q.n=norm(q.n);q.w=norm(q.w);queue(q);continue}
    if(!q||!q.m||!q.n||!Array.isArray(q.b)){bad++;continue}
    q.n=norm(q.n);
    if(S.months[q.m]&&S.months[q.m].final){queue(q);continue}
    if(q.m===S.cur&&!undone){pushUndo();undone=true}
    const i=applied.findIndex(x=>x.q.m===q.m&&norm(x.q.n)===q.n);const res={q,...applyRequest(q)};if(i>=0)applied[i]=res;else applied.push(res)}
  save();
  const months=[...new Set(applied.map(x=>x.q.m))];
  if(!queued.length&&months.length===1&&months[0]!==S.cur){S.cur=months[0];undoStack=[];$('#bUndo').disabled=true;save()}
  render();
  let html=`<h3>נקלטו ${applied.length+queued.length} בקשות</h3>`;
  if(applied.length)html+=`<h4>נכנסו ישר ללוח</h4><ul class="issues" style="padding-right:18px">${applied.map(x=>{const c=checkBlocks(x.q.m,x.q.g,x.q.bu||x.q.b);return`<li class="${c.errs.length?'err':''}">${esc(x.p.name)} (${kLabel(x.q.m)}): ${(x.q.bu||x.q.b).length} חסימות${x.q.vac&&x.q.vac.length?`, <b>${x.q.vac.length} ימי ${x.q.vre&&x.q.vre!=='חופשה'?esc(x.q.vre):`חופשה מאושרת (אישר: ${esc(x.q.vby||'לא צוין')})`}</b>`:''}${x.isNew?', מתמחה חדש נוסף לרשימה':''}${x.mismatch?', הגיש בקבוצה אחרת מזו שבלוח':''}${c.errs.length?', '+esc(c.errs.join(', ')):''}</li>`}).join('')}</ul>`;
  if(queued.length)html+=`<h4>ממתינים לאישור שלך</h4><ul class="issues" style="padding-right:18px">${queued.map(q=>`<li>${esc(q.n)}: ${q.type==='chg'?(q.kind==='swap'?'בקשת החלפה':'בקשה למסור משמרת'):'בקשה ללוח שכבר נסגר'}</li>`).join('')}</ul>`;
  if(bad)html+=`<p class="errs">${bad} בקשות פגומות לא נקלטו</p>`;
  openSheet(html+`<div class="foot"><button class="btn primary" data-close>סגור</button></div>`);
}
function apiOn(){return!!(S.settings.apiUrl&&S.settings.apiKey)}
let pulling=false;
async function pullRequests(auto){

  if(pulling)return;pulling=true;
  try{const r=await fetch(S.settings.apiUrl+'?action=requests&key='+encodeURIComponent(S.settings.apiKey));const j=await r.json();
    if(!j.ok)throw new Error(j.error==='key'?'המפתח לא תואם לשרת':String(j.error||'שגיאה'));
    const seen=new Set(S.apiSeen||[]);const fresh=(j.items||[]).filter(x=>!seen.has(x.row));

function chgCheck(q){
  const errs=[],mo=S.months[q.m],p1=findPerson(q.n)||matchName(q.n),p2=findPerson(q.w)||matchName(q.w);
  if(!mo){errs.push(`אין לוח ל${kLabel(q.m)}`);return{errs}}
  if(!p1||!mo.roster[p1.id])errs.push(`${q.n} לא נמצא בלוח`);
  if(!p2||!mo.roster[p2.id])errs.push(`${q.w} לא נמצא בלוח`);
  if(p1&&p2&&p1.id===p2.id)errs.push('אותו מתמחה בשני הצדדים');
  const has=(p,d,c)=>{const cl=mo.cells[p.id+'|'+d];return!!(cl&&cl.c.includes(c))};
  if(p1&&!has(p1,q.d1,q.c1))errs.push(`${q.n} לא משובץ ל${typeBy(q.c1)?.name||q.c1} ב־${q.d1}`);
  if(q.kind==='swap'&&p2&&!has(p2,q.d2,q.c2))errs.push(`${q.w} לא משובץ ל${typeBy(q.c2)?.name||q.c2} ב־${q.d2}`);
  return{errs,p1,p2,mo};
}
function applyChange(q){
  const{errs,p1,p2,mo}=chgCheck(q);if(errs.length)throw new Error(errs.join(', '));
  const rm=(p,d,c)=>{const k=p.id+'|'+d,cl=mo.cells[k];cl.c=cl.c.filter(x=>x!==c);if(!cl.c.length&&!cl.mk)delete mo.cells[k]};
  const ad=(p,d,c)=>{const k=p.id+'|'+d,cl=mo.cells[k]||{c:[],mk:''};if(!cl.c.includes(c))cl.c.push(c);mo.cells[k]=cl};
  rm(p1,q.d1,q.c1);ad(p2,q.d1,q.c1);
  if(q.kind==='swap'){rm(p2,q.d2,q.c2);ad(p1,q.d2,q.c2)}
  return{p1,p2};
}
function chgText(q){const tn=c=>typeBy(c)?.name||c;
  return q.kind==='swap'?`${q.n} (${q.d1}, ${tn(q.c1)}) מתחלף עם ${q.w} (${q.d2}, ${tn(q.c2)})`:`${q.n} מוסר ל${q.w} את ${tn(q.c1)} ב־${q.d1}`}
function simulateChange(q){
  const chk=chgCheck(q);if(chk.errs.length)return{errs:chk.errs,issues:[]};
  const saveCur=S.cur,snap=JSON.stringify(S.months[q.m]);const out=[];
  try{S.cur=q.m;const before=analyze().issues;applyChange(q);const after=analyze().issues;
    const ks=[chk.p1.id+'|'+q.d1,chk.p2.id+'|'+q.d1];if(q.kind==='swap')ks.push(chk.p1.id+'|'+q.d2,chk.p2.id+'|'+q.d2);
    for(const k of new Set(ks)){const a=after[k];if(!a)continue;const b=before[k]?before[k].msgs:[];for(const m of a.msgs)if(!b.includes(m))out.push({lvl:a.lvl,msg:`${pname(k.split('|')[0])}, ${k.split('|')[1]}: ${m}`})}}
  catch(e){out.push({lvl:'err',msg:e.message})}
  finally{S.months[q.m]=JSON.parse(snap);S.cur=saveCur}
  return{errs:[],issues:out};
}

  for(const key of Object.keys(x.months).sort()){
    if(S.months[key]){skipped.push(key);continue}
    const mo=x.months[key],roster={},cells={};
    for(const id in mo.roster)if(idMap[id])roster[idMap[id]]=mo.roster[id];

}

      <div class="foot"><button class="btn primary" id="rsAdd" ${newKeys.length?'':'disabled'}>הוסף חודשים חדשים</button><button class="btn danger" id="rsAll">החלף הכול</button><button class="btn" data-close>ביטול</button></div>`);
    sh.el.querySelector('#rsAdd').onclick=()=>{const r=mergeBackup(x);if(r.added.length)S.cur=r.added[r.added.length-1];undoStack=[];save();sh.close();render();toast(`נוספו: ${r.added.map(kLabel).join(', ')}${r.skipped.length?`. לא שונו: ${r.skipped.map(kLabel).join(', ')}`:''}`,5000)};
    sh.el.querySelector('#rsAll').onclick=()=>{if(!confirm('למחוק את כל הנתונים באתר ולהחליף בגיבוי?'))return;const keepApi={apiUrl:S.settings.apiUrl,apiKey:S.settings.apiKey};S=x;if(!Array.isArray(S.pending))S.pending=[];if(!S.settings.req)S.settings.req={...REQ_DEFAULT};if(!S.settings.apiUrl&&keepApi.apiUrl)S.settings.apiUrl=keepApi.apiUrl;if(!S.settings.apiKey&&keepApi.apiKey)S.settings.apiKey=keepApi.apiKey;if(!S.months[S.cur])S.cur=Object.keys(S.months).sort().pop();undoStack=[];save();location.reload()};
  }catch(err){toast('הטעינה נכשלה: '+err.message,4500)}};fr.readAsText(f)});

$('#fileIn').onchange=e=>{const f=e.target.files[0];if(f)importXlsx(f);e.target.value=''};
$('#bExport').onclick=exportXlsx;
$('#bClear').onclick=()=>{if(!confirm('למחוק את כל השיבוצים בחודש הזה? סימוני חופש ואילוץ יישארו.'))return;pushUndo();for(const k in M().cells){const cl=M().cells[k];cl.c=[];if(!cl.mk)delete M().cells[k]}save();render();toast('השיבוצים נמחקו. אפשר לבטל')};

$('#main').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){cellSheet(b.dataset.p,Number(b.dataset.d));return}
  if(b.dataset.cov){covSheet(b.dataset.cov,Number(b.dataset.d));return}
  if(b.dataset.person){tab='people';render();return}
  if(b.dataset.pref){const pid=b.closest('tr').dataset.pid,r=M().roster[pid];r.pref=r.pref||{};const v=r.pref[b.dataset.pref];if(v===1)r.pref[b.dataset.pref]=-1;else if(v===-1)delete r.pref[b.dataset.pref];else r.pref[b.dataset.pref]=1;save();renderPeople();return}
  if(b.dataset.del){const pid=b.dataset.del;if(!confirm(`להסיר את ${pname(pid)} מהחודש הזה, כולל השיבוצים שלו?`))return;pushUndo();delete M().roster[pid];for(const k in M().cells)if(k.startsWith(pid+'|'))delete M().cells[k];save();renderPeople();return}
  if(b.id==='planGo'){importPlanText($('#planPaste').value);return}
  if(b.dataset.rudel){const p=person(b.dataset.rudel);if(p&&confirm(`להסיר את הכללים האישיים של ${p.name}?`)){delete p.rules;save();renderPeople()}return}
  if(b.id==='bDup'){dupSheet();return}
  if(b.id==='bAddP'){const id=uid();S.people.push({id,name:'מתמחה חדש'});M().roster[id]=blankRoster('A','אגף א','',Object.keys(M().roster).length+1);save();renderPeople();const inp=document.querySelector(`tr[data-pid="${id}"] input[data-f="name"]`);inp&&(inp.focus(),inp.select());return}
  if(b.id==='bCopy'){copyLuach();return}
  if(b.id==='bCal'){calSheet();return}
  if(b.id==='bPub'){publishCalendar();return}
  if(b.dataset.tdel!==undefined){const t=S.types[+b.dataset.tdel];if(!confirm(`למחוק את "${t.name}"? שיבוצים קיימים בקוד ${t.code} יסומנו כקוד לא מוכר.`))return;S.types.splice(+b.dataset.tdel,1);save();renderSettings();return}
  if(b.id==='bAddT'){S.types.push(T('x'+(S.types.length+1),'משמרת חדשה','חדש','duty','16:00','08:00',['A','R'],[0,0,0,0,0,0,0],'slate'));save();renderSettings();return}
  if(b.id==='bResetT'){if(!confirm('להחזיר את רשימת המשמרות לברירת המחדל?'))return;S.types=defaultTypes();save();renderSettings();return}
  if(b.id==='bHol'){pushUndo();const a=autoTypes(S.cur);for(const d in M().dayTypes)if(!a[d])delete M().dayTypes[d];Object.assign(M().dayTypes,a);save();toast('החגים סומנו מחדש');return}
  if(b.id==='bBackup'){backupDownload();return}
  if(b.id==='bRestore'){$('#restoreIn').click();return}
  if(b.id==='bReset'){if(!confirm('זה ימחק את כל החודשים והמתמחים ששמרתם בדפדפן. להמשיך?'))return;S=seedState();undoStack=[];save();tab='grid';render();return}
});
$('#main').addEventListener('click',e=>{
  const th=e.target.closest('th.day');if(!th)return;
  const d=Number(th.dataset.day), cur=dtype(d), next=cur===''?'eve':cur==='eve'?'hol':'';
  pushUndo(); if(next)M().dayTypes[d]=next; else delete M().dayTypes[d]; save(); renderGrid();
  toast(`${fmtDate(d)}: ${next==='eve'?'ערב חג':next==='hol'?'חג':'יום רגיל'}`,1600);
});
$('#main').addEventListener('change',e=>{
  const el=e.target;
  const tr=el.closest('tr[data-pid]');
  if(el.id==='ruAdd'&&el.value){const p=person(el.value);p.rules={};save();renderPeople();return}
  if(el.dataset.ru){const p=person(el.closest('tr[data-rp]').dataset.rp);p.rules=p.rules||{};const k=el.dataset.ru;
    if(k==='shabbat')p.rules.shabbat=el.checked;else if(k==='rotD'){if(el.value==='')delete p.rules.rotD;else p.rules.rotD=Number(el.value)}else p.rules[k]=el.value;save();return}
  if(el.dataset.plan){const[pid,k]=el.dataset.plan.split('|');S.rotPlan=S.rotPlan||{};const v=norm(el.value);S.rotPlan[pid]=S.rotPlan[pid]||{};if(v)S.rotPlan[pid][k]=v;else delete S.rotPlan[pid][k];
    if(S.months[k]&&v){if(S.months[k].final&&!confirm(`הלוח של ${kLabel(k)} כבר אושר סופית. לעדכן בו גם את הקבוצה?`)){save();return}applyPlan(k)}save();renderPeople();return}
  if(tr&&el.dataset.qual){const p=person(tr.dataset.pid);p.quals=p.quals||{};if(el.checked)p.quals[el.dataset.qual]=true;else delete p.quals[el.dataset.qual];save();return}
  if(tr&&el.dataset.f){const pid=tr.dataset.pid,r=M().roster[pid],f=el.dataset.f;
    if(f==='name'){person(pid).name=el.value.trim()||person(pid).name}
    else if(f==='group'){r.group=el.value;if(el.value==='A'&&!r.rot)r.rot='אגף א';if(el.value!=='A'&&r.rot==='אגף א')r.rot=''}
    else if(f==='tS'||f==='tD'){r[f]=el.value===''?null:Number(el.value)}
    else if(f==='extraVac'){r.extraVac=Number(el.value)||0}
    else if(f==='signer'){person(pid).signer=el.checked}
    else if(f==='home'){r.home=el.value}
    else r[f]=el.value;
    save();if(f==='group'||f==='extraVac'||f==='tS'||f==='tD')renderPeople();return}
  if(el.id==='surg24'){S.settings.surg24=el.checked;save();return}
  if(el.dataset.s){S.settings[el.dataset.s]=Number(el.value)||0;save();return}
  if(el.id==='dlInput'){S.settings.req.deadlines=S.settings.req.deadlines||{};if(el.value)S.settings.req.deadlines[S.cur]=el.value;else delete S.settings.req.deadlines[S.cur];save();toast(el.value?'המועד נשמר. אחריו הטופס ננעל':'המועד בוטל');return}
  if(el.dataset.rs==='apiUrl'||el.dataset.rs==='apiKey'){const had=S.savedAt;S.settings[el.dataset.rs]=el.value.trim();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(S.settings.apiUrl&&S.settings.apiKey)loadFromServer();return}
  if(el.dataset.rs==='formUrl'){S.settings.formUrl=el.value.trim();save();return}
  if(el.dataset.rs){const k=el.dataset.rs;S.settings.req[k]=k==='deadline'?el.value.trim():(Number(el.value)||0);save();return}
  const ttr=el.closest('tr[data-ti]');
  if(ttr){const t=S.types[+ttr.dataset.ti];
    if(el.dataset.tf){const f=el.dataset.tf;if(f==='code'){const nv=el.value.trim();if(!nv||S.types.some(x=>x!==t&&x.code===nv)){toast('הקוד ריק או כבר קיים');el.value=t.code;return}t.code=nv}else t[f]=el.value;if(f==='color'){el.className='c-'+el.value}}
    if(el.dataset.tsg!==undefined){t.signer=el.checked}
    if(el.dataset.tflag){t[el.dataset.tflag]=el.checked}
    if(el.dataset.tsr!==undefined){t.sigReq=t.sigReq||[0,0,0,0,0,0,0];t.sigReq[+el.dataset.tsr]=el.checked?1:0}
    if(el.dataset.tg){const g=el.dataset.tg;t.groups=el.checked?[...new Set([...t.groups,g])]:t.groups.filter(x=>x!==g)}
    if(el.dataset.tn!==undefined){t.need[+el.dataset.tn]=el.checked?1:0}
    save();}
});
render();
loadFromServer().then(()=>{if(tab==='inbox')pullRequests(true)});
</script>
