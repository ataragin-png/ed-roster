<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול שיבוץ בכירים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<style>
header.top,.wrap{max-width:1400px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar select{font-weight:600;font-size:15px}
.sync{font-size:12.5px;color:var(--muted)}
.sync.bad{color:var(--danger);font-weight:600}
.gridwrap{overflow:auto;max-height:calc(100vh - 210px);min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px}
.grid th,.grid td{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:0;text-align:center;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:600;padding:4px 4px;height:44px}
.grid thead th small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grid .dcol{position:sticky;right:0;z-index:2;background:var(--surface);text-align:right;padding:0 8px;min-width:78px;font-weight:700;border-left:1px solid var(--line)}
.grid thead .dcol{z-index:4}
.grid .dcol small{font-weight:400;color:var(--muted);display:block;font-size:10.5px;line-height:11px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.grid tr.wk td,.grid tr.wk .dcol{background:var(--wk)}
.grid tr.hol td,.grid tr.hol .dcol{background:var(--hol)}
.grid tr.eve td,.grid tr.eve .dcol{background:var(--eve)}
.grid tr.today .dcol{box-shadow:inset -3px 0 0 var(--primary)}
.cellb{width:96px;height:32px;border:0;background:none;padding:2px 4px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:block}
.cellb:hover{background:rgba(28,78,121,.08)}
.cellb.empty{color:var(--danger);font-weight:500}
.cellb.off{color:var(--muted);font-weight:400;cursor:default}
.cellb.opt{color:var(--muted);font-weight:400}
td.err{box-shadow:inset 0 0 0 2px var(--danger)}
td.warn{box-shadow:inset 0 0 0 2px var(--warn)}
td.hl .cellb{background:var(--primary);color:var(--primary-ink)}
.pick{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;margin-top:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius-m);padding:7px 10px;text-align:right}
.pick button:hover{border-color:var(--primary)}
.pick button.no{opacity:.55}
.pick .why{font-size:12px;color:var(--muted)}
.pick .why .w{color:var(--ok);font-weight:600}.pick .why .s{color:var(--warn);font-weight:600}.pick .why .b{color:var(--danger);font-weight:600}
.issues{margin:0;padding-right:18px}
.issues li{margin:2px 0}
.reqcard{border:1px solid var(--line2);border-radius:var(--radius-m);padding:10px;margin-bottom:8px;background:var(--surface)}
.reqcard.done{opacity:.6}
.reqcard pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit;font-size:13px}
td.bar{min-width:120px}
.barbg{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.barfg{height:8px;background:var(--primary)}
.days7{display:inline-flex;gap:2px}
.days7 label{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.namefilter{min-width:140px}
@media print{.gridwrap{max-height:none;overflow:visible;border:0}.printonly{display:block!important}.sync,.legend{display:none}.grid thead th{position:static}.grid .dcol{position:static}.wrap{max-width:none;padding:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>ניהול שיבוץ בכירים</h1><p>רפואה דחופה · לא לשתף את הקישור הזה</p></div>
  <div class="sync" id="sync"></div>
</header>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="grid">לוח</button>
    <button role="tab" data-tab="reqs">בקשות</button>
    <button role="tab" data-tab="sum">סיכום</button>
    <button role="tab" data-tab="people">בכירים</button>
    <button role="tab" data-tab="set">הגדרות</button>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script src="core.js"></script>
<script>
const SKEY = 'sr-admin-v1';
const uid = () => 'p' + Math.random().toString(36).slice(2, 8);
function blankState() {
  return { v: 1, people: [], slots: DEFAULT_SLOTS.map(s => ({ ...s })), months: {}, deadlines: {}, cur: monthOpts()[1], settings: { apiUrl: getApi(), apiKey: '' }, ts: '', savedAt: 0 };
}
let S = lsGet(SKEY, null) || blankState();
S.settings = S.settings || { apiUrl: getApi(), apiKey: '' };
if (!S.settings.apiUrl) S.settings.apiUrl = getApi();
let TAB = lsGet('sr-admin-tab', 'grid'), HL = '', DIRTY = false, SYNC = '';
const M = () => (S.months[S.cur] = S.months[S.cur] || { grid: {}, req: {} });
const P = id => S.people.find(p => p.id === id);
const pname = id => P(id)?.name || '?';
const active = () => S.people.filter(p => p.active !== false);
const apiOn = () => !!(S.settings.apiUrl && S.settings.apiKey);
const slotsOn = d => S.slots.filter(s => slotDays(s).includes(kWd(S.cur, d)));

/* ---------- שמירה וסנכרון ---------- */
let saveTimer = null;
function save(now) {
  S.savedAt = Date.now(); lsSet(SKEY, S); DIRTY = true; setSync('שומר…');
  clearTimeout(saveTimer); saveTimer = setTimeout(pushState, now ? 0 : 1200);
}
function setSync(t, bad) { SYNC = t; const el = $('#sync'); if (el) { el.textContent = t; el.className = 'sync' + (bad ? ' bad' : ''); } }
async function pushState() {
  if (!apiOn()) { DIRTY = false; setSync('נשמר בדפדפן בלבד (לא מחובר לשרת)', true); return; }
  try {
    const body = { ...S, settings: { ...S.settings, apiKey: '' } };
    const j = await apiPost(S.settings.apiUrl, { action: 'saveState', key: S.settings.apiKey, base: S.ts || null, state: JSON.stringify(body) });
    if (!j.ok) {
      if (j.error === 'stale') { setSync('הנתונים שונו ממקום אחר', true); staleSheet(); return; }
      throw new Error(j.error);
    }
    S.ts = j.ts; lsSet(SKEY, S); DIRTY = false; setSync('נשמר ✓ ' + new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { setSync('השמירה לשרת נכשלה: ' + e.message, true); }
}
function staleSheet() {
  const sh = openSheet(`<h3>הלוח שונה במחשב אחר</h3><p class="sub">מישהו שמר גרסה חדשה יותר. מה לעשות?</p><div class="foot"><button class="btn primary" id="ld">לטעון את הגרסה מהשרת</button><button class="btn danger" id="ow">לדרוס עם הגרסה שלי</button></div>`);
  sh.el.querySelector('#ld').onclick = async () => { sh.close(); await pullState(true); };
  sh.el.querySelector('#ow').onclick = async () => { sh.close(); S.ts = null; await pushState(); };
}
async function pullState(force) {
  if (!apiOn()) return;
  setSync('טוען מהשרת…');
  try {
    const j = await apiGet(S.settings.apiUrl, { action: 'state', key: S.settings.apiKey });
    if (!j.ok) { setSync(j.error === 'key' ? 'מפתח שגוי' : 'שגיאה בטעינה', true); return; }
    if (j.state && (force || String(j.ts) !== String(S.ts))) {
      const st = JSON.parse(j.state), keep = S.settings;
      S = { ...blankState(), ...st, settings: keep, ts: j.ts }; lsSet(SKEY, S);
    } else if (!j.state) { S.ts = ''; }
    setSync('מסונכרן ✓'); render();
  } catch (e) { setSync('אין חיבור לשרת', true); }
}
async function pushConfig() {
  if (!apiOn()) return false;
  const config = { names: active().map(p => p.name).sort((a, b) => a.localeCompare(b, 'he')), slots: S.slots, deadlines: S.deadlines };
  const j = await apiPost(S.settings.apiUrl, { action: 'config', key: S.settings.apiKey, config });
  return j.ok;
}

/* ---------- בדיקות ---------- */
function reqOf(pid) { return M().req[pid] || null; }
function blockOf(pid, d) { const q = reqOf(pid); if (!q) return null; if (inVac(q.vac, d)) return { t: 'v' }; if (q.b && d in q.b) return { t: 'b', p: q.b[d] }; return null; }
function markOf(pid, d) { const q = reqOf(pid); if (!q) return null; if (q.w && d in q.w) return { t: 'w', p: q.w[d] }; if (q.s && d in q.s) return { t: 's', p: q.s[d] }; return null; }
function dayShifts(pid, d) { const G = M().grid; return S.slots.filter(s => G[d + '|' + s.id] === pid); }
function targetOf(pid) { const q = reqOf(pid), p = P(pid); const w = q && q.want !== '' && q.want != null ? Number(q.want) : (p?.want !== '' && p?.want != null ? Number(p.want) : null); return Number.isFinite(w) ? w : null; }
function analyze() {
  const G = M().grid, key = S.cur, dim = kDim(key), cells = {}, errs = [], warns = [];
  let missing = 0;
  const per = {}; for (const p of S.people) per[p.id] = { n: 0, wk: 0, m: 0, e: 0, area: {} };
  for (let d = 1; d <= dim; d++) {
    for (const s of slotsOn(d)) {
      const pid = G[d + '|' + s.id];
      if (!pid) { if (!s.opt) missing++; continue; }
      const st = per[pid] || (per[pid] = { n: 0, wk: 0, m: 0, e: 0, area: {} });
      st.n++; if (kWeekend(key, d)) st.wk++; if (s.from < 16) st.m++; else st.e++; st.area[s.area] = (st.area[s.area] || 0) + 1;
      const k = d + '|' + s.id, why = [];
      let lvl = '';
      const bl = blockOf(pid, d);
      if (bl && (bl.t === 'v' || partHits(bl.p, s))) { lvl = 'err'; why.push(bl.t === 'v' ? 'בחופשה' : 'ביקש/ה לא לעבוד' + (bl.p ? ' ב' + PARTS[bl.p] : '')); }
      const same = dayShifts(pid, d).filter(x => x.id !== s.id);
      const ovh = x => overlap(x, s) ? Math.min(x.to, s.to) - Math.max(x.from, s.from) : 0;
      if (same.some(x => ovh(x) >= 4)) { lvl = 'err'; why.push('משובץ/ת בשעות חופפות'); }
      else if (same.some(x => ovh(x) > 0)) { lvl = lvl || 'warn'; why.push('משמרת כפולה עם חפיפה קצרה'); }
      else if (same.some(x => !x.oc && !s.oc)) { lvl = lvl || 'warn'; why.push('שתי משמרות באותו יום'); }
      const mk = markOf(pid, d);
      if (mk?.t === 's' && partHits(mk.p, s)) { lvl = lvl || 'warn'; why.push('ביקש/ה עדיף שלא'); }
      if (s.from < 12 && d > 1 && dayShifts(pid, d - 1).some(x => x.to >= 24)) { lvl = lvl || 'warn'; why.push('ערב ואחריו בוקר'); }
      if (!P(pid)) { lvl = 'err'; why.push('בכיר/ה שנמחק/ה'); }
      if (lvl) { cells[k] = { lvl, why }; (lvl === 'err' ? errs : warns).push({ d, s, pid, why }); }
    }
  }
  return { cells, errs, warns, missing, per };
}

/* ---------- מילוי אוטומטי ---------- */
function autofill(opts = {}) {
  const key = S.cur, dim = kDim(key), G = M().grid, ppl = active();
  if (!ppl.length) { toast('אין בכירים ברשימה'); return 0; }
  const A0 = analyze();
  const cnt = {}, wk = {}; for (const p of ppl) { cnt[p.id] = A0.per[p.id]?.n || 0; wk[p.id] = A0.per[p.id]?.wk || 0; }
  let total = 0; for (let d = 1; d <= dim; d++) total += slotsOn(d).filter(s => !s.opt || opts.opt).length;
  const fixedT = ppl.map(p => targetOf(p.id)).filter(x => x != null);
  const freeN = ppl.filter(p => targetOf(p.id) == null).length;
  const share = freeN ? Math.max(0, (total - fixedT.reduce((a, b) => a + b, 0)) / freeN) : 0;
  const tgt = {}; for (const p of ppl) tgt[p.id] = targetOf(p.id) ?? share;
  const avail = (pid, d, s) => {
    const bl = blockOf(pid, d); if (bl && (bl.t === 'v' || partHits(bl.p, s))) return false;
    const same = dayShifts(pid, d); if (same.some(x => overlap(x, s))) return false;
    const light = x => x.oc || x.area === 'N';
    if (same.length && !(opts.doubles && (light(s) ? same.every(x => !light(x)) : same.every(light)))) return false;
    return true;
  };
  const jobs = [];
  for (let d = 1; d <= dim; d++) for (const s of slotsOn(d)) if (!G[d + '|' + s.id] && (!s.opt || opts.opt)) jobs.push({ d, s });
  jobs.forEach(j => j.n = ppl.filter(p => avail(p.id, j.d, j.s)).length);
  jobs.sort((a, b) => a.n - b.n || a.d - b.d);
  let filled = 0;
  for (const { d, s } of jobs) {
    let best = null, bs = Infinity;
    for (const p of ppl) {
      if (!avail(p.id, d, s)) continue;
      const mk = markOf(p.id, d); let sc = 0;
      const t = tgt[p.id] || 0.01;
      sc += (cnt[p.id] / t) * 100;
      if (cnt[p.id] >= tgt[p.id]) sc += 400;
      if (mk?.t === 'w' && partHits(mk.p, s)) sc -= 300;
      if (mk?.t === 's' && partHits(mk.p, s)) sc += 250;
      if (kWeekend(key, d)) sc += wk[p.id] * 40;
      const ar = reqOf(p.id)?.areas?.length ? reqOf(p.id).areas : (P(p.id).areas || []);
      if (ar.length) sc += ar.includes(s.area) ? -25 : 25;
      if (s.from < 12 && d > 1 && dayShifts(p.id, d - 1).some(x => x.to >= 24)) sc += 120;
      if (s.to >= 24 && d < dim && dayShifts(p.id, d + 1).some(x => x.from < 12)) sc += 120;
      sc += Math.random() * 3;
      if (sc < bs) { bs = sc; best = p; }
    }
    if (best) { G[d + '|' + s.id] = best.id; cnt[best.id]++; if (kWeekend(key, d)) wk[best.id]++; filled++; }
  }
  return filled;
}

/* ---------- תצוגה ---------- */
function render() {
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === TAB));
  setSync(SYNC);
  if (!S.settings.apiKey && !S._skipKey) return renderLogin();
  ({ grid: renderGrid, reqs: renderReqs, sum: renderSum, people: renderPeople, set: renderSet }[TAB] || renderGrid)();
}
function monthSel() {
  const opts = [...new Set([...monthOpts(2, 4), ...Object.keys(S.months)])].sort();
  return `<select id="cur" aria-label="חודש">${opts.map(k => `<option value="${k}" ${k === S.cur ? 'selected' : ''}>${kLabel(k)}</option>`).join('')}</select>`;
}
function bindMonth() { const el = $('#cur'); if (el) el.onchange = e => { S.cur = e.target.value; lsSet(SKEY, S); render(); }; }

function renderLogin() {
  $('#main').innerHTML = `<div class="card" style="max-width:460px"><h2>כניסה</h2><p class="sub">הזינו את מפתח הניהול שקיבלתם. הוא נשמר רק בדפדפן הזה.</p>
    <label class="f" for="k">מפתח ניהול</label><input type="password" id="k" style="width:100%" autocomplete="off">
    ${S.settings.apiUrl ? '' : `<label class="f" for="u">כתובת השרת</label><input type="text" id="u" style="width:100%" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec">`}
    <div class="row" style="margin-top:12px"><button class="btn primary" id="go">כניסה</button><button class="btn" id="skip">עבודה בלי שרת</button></div></div>`;
  $('#go').onclick = async () => {
    const k = $('#k').value.trim(); const u = $('#u')?.value.trim(); if (u) S.settings.apiUrl = u;
    if (!k) return toast('הזינו מפתח');
    S.settings.apiKey = k; lsSet(SKEY, S);
    try { const j = await apiGet(S.settings.apiUrl, { action: 'state', key: k }); if (!j.ok) { S.settings.apiKey = ''; lsSet(SKEY, S); return toast(j.error === 'key' ? 'מפתח שגוי' : 'שגיאה: ' + j.error); } }
    catch (e) { S.settings.apiKey = ''; lsSet(SKEY, S); return toast('אין חיבור לשרת'); }
    await pullState(true); render();
  };
  $('#skip').onclick = () => { S._skipKey = true; render(); };
}

function renderGrid() {
  const key = S.cur, dim = kDim(key), G = M().grid, H = hol(key), A = analyze();
  const today = new Date(); const tkey = `${today.getFullYear()}-${pad2(today.getMonth() + 1)}`;
  let head = `<tr><th class="dcol">יום</th>${S.slots.map(s => `<th><span class="chip a-${s.area}">${esc(slotName(s))}</span><small class="num">${slotTime(s)}${s.opt ? ' · רשות' : ''}</small></th>`).join('')}</tr>`;
  let body = '';
  for (let d = 1; d <= dim; d++) {
    const on = new Set(slotsOn(d).map(s => s.id));
    body += `<tr class="${dayClass(key, d)}${key === tkey && d === today.getDate() ? ' today' : ''}"><td class="dcol num">${d} ${WD[kWd(key, d)]}׳${H[d] ? `<small>${esc(H[d].name)}</small>` : ''}</td>`;
    for (const s of S.slots) {
      const k = d + '|' + s.id, pid = G[k], c = A.cells[k];
      if (!on.has(s.id)) { body += `<td><span class="cellb off">·</span></td>`; continue; }
      body += `<td class="${c ? c.lvl : ''}${HL && pid === HL ? ' hl' : ''}"><button class="cellb${pid ? '' : s.opt ? ' opt' : ' empty'}" data-k="${k}" title="${c ? esc(c.why.join(' · ')) : ''}">${pid ? esc(pname(pid)) : s.opt ? '—' : 'חסר'}</button></td>`;
    }
    body += `</tr>`;
  }
  const names = active().slice().sort((a, b) => a.name.localeCompare(b.name, 'he'));
  $('#main').innerHTML = `
  <div class="toolbar noprint">
    ${monthSel()}
    <span class="pill ${A.missing ? 'bad' : 'good'}">חסרים: <b class="num">${A.missing}</b></span>
    <button class="pill ${A.errs.length ? 'bad' : 'good'}" id="showErr" style="cursor:pointer">שגיאות: <b class="num">${A.errs.length}</b></button>
    <button class="pill ${A.warns.length ? 'mid' : ''}" id="showWarn" style="cursor:pointer">אזהרות: <b class="num">${A.warns.length}</b></button>
    <select id="hl" class="namefilter" aria-label="הדגשת בכיר"><option value="">הדגשת בכיר…</option>${names.map(p => `<option value="${p.id}" ${p.id === HL ? 'selected' : ''}>${esc(p.name)} (${A.per[p.id]?.n || 0})</option>`).join('')}</select>
    <span style="flex:1"></span>
    <button class="btn" id="auto">מילוי אוטומטי</button>
    <button class="btn" id="clr">ניקוי</button>
    <button class="btn" id="imp">ייבוא מהסידור הכללי</button>
    <button class="btn" id="exm">עדכון הסידור הכללי</button>
    <button class="btn" id="csv">ייצוא לאקסל</button>
    <button class="btn" id="prt">הדפסה</button>
    <button class="btn primary" id="pub">פרסום לבכירים</button>
  </div>
  ${M().pubAt ? `<p class="sync noprint" style="margin:-4px 0 8px">פורסם לאחרונה: ${new Date(M().pubAt).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}${M().pubAt < (M().editAt || 0) ? ' · <b style="color:var(--warn)">יש שינויים שלא פורסמו</b>' : ''}</p>` : ''}
  <h2 style="display:none" class="printonly">${kLabel(key)}</h2>
  <div class="gridwrap"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <div class="legend"><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--danger)"></i>שגיאה (חסום / חופשה / חפיפה)</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--warn)"></i>אזהרה (עדיף שלא / כפולה / ערב ואז בוקר)</span><span><i class="sw" style="background:var(--wk)"></i>סופ״ש</span><span><i class="sw" style="background:var(--hol)"></i>חג</span></div>`;
  bindMonth();
  $$('.cellb[data-k]').forEach(b => b.onclick = () => pickCell(b.dataset.k));
  $('#hl').onchange = e => { HL = e.target.value; renderGrid(); };
  $('#showErr').onclick = () => issuesSheet('שגיאות', A.errs);
  $('#showWarn').onclick = () => issuesSheet('אזהרות', A.warns);
  $('#auto').onclick = () => {
    const sh = openSheet(`<h3>מילוי אוטומטי</h3><p class="sub">ממלא רק משבצות ריקות. לא משבץ מי שביקש לא לעבוד או בחופשה, מעדיף את מי שביקש לעבוד, ומאזן לפי מספר המשמרות הרצוי ולפי סופ״שים.</p>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dbl" checked> לאפשר כוננות או לילה באותו יום עם משמרת (בלי חפיפה בשעות)</label>

  <div class="card scroll"><table class="list"><thead><tr><th>בכיר</th><th>משמרות</th><th>רצוי</th><th class="bar"></th><th>בקרים</th><th>ערבים</th><th>סופ״ש וחג</th>${Object.values(AREAS).map(a => `<th>${a}</th>`).join('')}<th>בקשה</th><th>בעיות</th></tr></thead><tbody>
  ${ppl.map(p => { const x = A.per[p.id] || { n: 0, wk: 0, m: 0, e: 0, area: {} }, t = targetOf(p.id), bad = A.errs.filter(e => e.pid === p.id).length, w = A.warns.filter(e => e.pid === p.id).length;
    return `<tr><td><button class="btn small" data-hl="${p.id}">${esc(p.name)}</button></td><td class="num"><b>${x.n}</b></td><td class="num">${t ?? '—'}</td>
    <td class="bar"><div class="barbg"><div class="barfg" style="width:${x.n / max * 100}%;${t != null && x.n > t ? 'background:var(--warn)' : ''}"></div></div></td>
    <td class="num">${x.m}</td><td class="num">${x.e}</td><td class="num">${x.wk}</td>${Object.keys(AREAS).map(a => `<td class="num">${x.area[a] || ''}</td>`).join('')}
    <td>${M().req[p.id] ? '<span class="pill good">יש</span>' : '<span class="pill">אין</span>'}</td><td>${bad ? `<span class="pill bad">${bad}</span>` : ''} ${w ? `<span class="pill mid">${w}</span>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  bindMonth();
  $$('[data-hl]').forEach(b => b.onclick = () => { HL = b.dataset.hl; TAB = 'grid'; lsSet('sr-admin-tab', TAB); render(); });
}

/* ---------- בכירים ---------- */
function renderPeople() {
  const ppl = S.people.slice().sort((a, b) => (a.active === false) - (b.active === false) || a.name.localeCompare(b.name, 'he'));
  $('#main').innerHTML = `<div class="card"><h2>רשימת הבכירים</h2><p class="sub">השמות כאן מופיעים בטופס הבקשות אחרי "שליחת הרשימה לטופס" או אחרי פרסום. "רצוי" הוא ברירת המחדל למספר משמרות בחודש, אם הבכיר לא כתב אחרת בבקשה.</p>
    <div class="row"><input type="text" id="nn" placeholder="שם חדש (אפשר כמה, מופרדים בפסיקים)" style="flex:1;min-width:200px"><button class="btn primary" id="add">הוספה</button></div></div>
  <div class="card scroll"><table class="list"><thead><tr><th>שם</th><th>רצוי בחודש</th><th>אזורים מועדפים</th><th>פעיל</th><th></th></tr></thead><tbody>
  ${ppl.map(p => `<tr data-id="${p.id}"><td><input type="text" data-f="name" value="${esc(p.name)}" style="min-width:150px"></td>
    <td><input type="number" data-f="want" value="${esc(p.want ?? '')}" style="width:80px"></td>
    <td>${Object.entries(AREAS).map(([k, v]) => `<label style="margin-left:8px;white-space:nowrap"><input type="checkbox" data-area="${k}" ${(p.areas || []).includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</td>
    <td><input type="checkbox" data-f="active" ${p.active !== false ? 'checked' : ''}></td>
    <td><button class="btn small" data-req="${p.id}">בקשה ל${kLabel(S.cur)}</button> <button class="btn small danger" data-del="${p.id}">מחיקה</button></td></tr>`).join('')}
  </tbody></table>${ppl.length ? '' : '<p class="muted">עוד אין בכירים. הוסיפו שמות למעלה.</p>'}
  <div class="row" style="margin-top:10px"><button class="btn" id="cfg">שליחת הרשימה לטופס</button></div></div>`;
  $('#add').onclick = () => { const v = $('#nn').value.split(/[,،\n]+/).map(norm).filter(Boolean); let n = 0; for (const name of v) if (!personByName(name)) { S.people.push({ id: uid(), name, want: '', areas: [], active: true }); n++; } save(); toast(`נוספו ${n}`); renderPeople(); };
  $('#nn').onkeydown = e => { if (e.key === 'Enter') $('#add').click(); };
  $$('tr[data-id]').forEach(tr => {
    const p = P(tr.dataset.id);
    tr.querySelector('[data-f=name]').onchange = e => { p.name = norm(e.target.value) || p.name; save(); };
    tr.querySelector('[data-f=want]').onchange = e => { p.want = e.target.value === '' ? '' : Number(e.target.value); save(); };
    tr.querySelector('[data-f=active]').onchange = e => { p.active = e.target.checked; save(); };
    tr.querySelectorAll('[data-area]').forEach(c => c.onchange = () => { p.areas = [...tr.querySelectorAll('[data-area]')].filter(x => x.checked).map(x => x.dataset.area); save(); });
  });
  $$('[data-req]').forEach(b => b.onclick = () => manualReq(b.dataset.req));
  $$('[data-del]').forEach(b => b.onclick = () => {
    const p = P(b.dataset.del); const used = Object.values(S.months).some(m => Object.values(m.grid).includes(p.id));
    const sh = openSheet(`<h3>למחוק את ${esc(p.name)}?</h3><p class="sub">${used ? 'יש לו/ה שיבוצים. אפשר לסמן "לא פעיל" במקום, והשיבוצים יישארו.' : ''}</p><div class="foot"><button class="btn danger" id="go">מחיקה</button><button class="btn" data-close>ביטול</button></div>`);
    sh.el.querySelector('#go').onclick = () => { for (const m of Object.values(S.months)) { for (const k in m.grid) if (m.grid[k] === p.id) delete m.grid[k]; delete m.req[p.id]; } S.people = S.people.filter(x => x !== p); sh.close(); save(); renderPeople(); };
  });
  $('#cfg').onclick = async () => { if (!apiOn()) return toast('אין חיבור לשרת'); toast((await pushConfig()) ? 'הרשימה נשלחה לטופס' : 'השליחה נכשלה'); };
}

/* ---------- הגדרות ---------- */
const MAIN_HDR = { 3: 'כונן', 4: 'אגף א · בכיר', 8: 'אגף ב · בכיר', 12: 'אגף ג · בכיר', 16: 'אגף ד · בכיר', 18: 'מהלכים צוות א', 20: 'מהלכים צוות ב', 21: 'מהלכים צוות ג', 31: 'ערב מהלכים 1', 32: 'ערב מהלכים 2', 33: 'ערב שוכבים 1', 34: 'ערב שוכבים 2', 36: 'לילה' };
function colName(c) { let s = '', n = c; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return `${s} · ${MAIN_HDR[c] || ''}`; }
function renderSet() {
  const dl = S.deadlines[S.cur] || '';
  const formUrl = new URL('./', location.href).href;
  $('#main').innerHTML = `
  <div class="card"><h2>משמרות</h2><p class="sub">כל שורה היא משבצת אחת בלוח, ומקושרת לעמודה של הבכירים בסידור הכללי של המלר״ד. משבצת "רשות" לא נספרת כחסר. ימים שלא מסומנים לא יופיעו בלוח.</p>
  <div class="scroll"><table class="list"><thead><tr><th>שם</th><th>אזור (לצבע ולהעדפות)</th><th>משעה</th><th>עד שעה</th><th>ימים</th><th>רשות</th><th>עמודה בסידור הכללי</th><th></th></tr></thead><tbody>
  ${S.slots.map((s, i) => `<tr data-i="${i}"><td><input type="text" data-f="name" value="${esc(slotName(s))}" style="width:130px"></td><td><select data-f="area">${Object.entries(AREAS).map(([k, v]) => `<option value="${k}" ${k === s.area ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
    <td><input type="number" min="0" max="23" data-f="from" value="${s.from}" style="width:70px"></td><td><input type="number" min="1" max="24" data-f="to" value="${s.to}" style="width:70px"></td>
    <td><span class="days7">${WD.map((w, j) => `<label>${w}<input type="checkbox" data-day="${j}" ${slotDays(s).includes(j) ? 'checked' : ''}></label>`).join('')}</span></td>
    <td><input type="checkbox" data-f="opt" ${s.opt ? 'checked' : ''}></td>
    <td><select data-f="col"><option value="">—</option>${[3,4,8,12,16,18,20,21,31,32,33,34,36].map(c => `<option value="${c}" ${c === s.col ? 'selected' : ''}>${colName(c)}</option>`).join('')}</select></td>
    <td><button class="btn small" data-up="${i}" ${i ? '' : 'disabled'} aria-label="למעלה">▲</button> <button class="btn small danger" data-rm="${i}">הסרה</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="addSlot">הוספת משבצת</button><button class="btn" id="resetSlots">חזרה לברירת המחדל</button></div></div>

  <div class="card"><h2>מועד אחרון להגשת בקשות</h2><p class="sub">אחרי המועד הטופס לא יקבל בקשות לחודש הזה.</p>
    <div class="row">${monthSel()}<input type="datetime-local" id="dl" value="${esc(dl)}"><button class="btn" id="saveDl">שמירה ושליחה לטופס</button>${dl ? '<button class="btn" id="noDl">ביטול המועד</button>' : ''}</div></div>

  <div class="card"><h2>קישורים</h2>
    <p>טופס הבקשות לבכירים (לשלוח לקבוצה):<br><a href="${esc(formUrl)}" target="_blank" dir="ltr">${esc(formUrl)}</a> <button class="btn small" id="cpForm">העתקה</button></p>
    <p class="muted">אתר הניהול הזה: לא לשתף.</p></div>

  <div class="card"><h2>שרת</h2>
    <label class="f">כתובת השרת</label><input type="text" id="api" dir="ltr" style="width:100%" value="${esc(S.settings.apiUrl)}">
    <label class="f">מפתח ניהול</label><input type="password" id="key" style="width:260px" value="${esc(S.settings.apiKey)}" autocomplete="off">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="saveApi">שמירה וטעינה מהשרת</button><button class="btn" id="out">יציאה מהדפדפן הזה</button></div></div>

  <div class="card"><h2>גיבוי</h2><div class="row"><button class="btn" id="exp">הורדת גיבוי</button><label class="btn">שחזור מגיבוי<input type="file" id="imp" accept=".json" hidden></label></div></div>`;
  bindMonth();
  $$('tr[data-i]').forEach(tr => {
    const s = S.slots[tr.dataset.i];
    tr.querySelector('[data-f=area]').onchange = e => { s.area = e.target.value; save(); };
    tr.querySelector('[data-f=name]').onchange = e => { s.name = norm(e.target.value) || s.name; save(); };
    tr.querySelector('[data-f=opt]').onchange = e => { s.opt = e.target.checked; save(); };
    tr.querySelector('[data-f=col]').onchange = e => { s.col = e.target.value ? Number(e.target.value) : undefined; save(); };
    tr.querySelector('[data-f=from]').onchange = e => { s.from = Math.max(0, Math.min(23, Number(e.target.value) || 0)); save(); };
    tr.querySelector('[data-f=to]').onchange = e => { s.to = Math.max(1, Math.min(24, Number(e.target.value) || 24)); save(); };
    tr.querySelectorAll('[data-day]').forEach(c => c.onchange = () => { s.days = [...tr.querySelectorAll('[data-day]')].filter(x => x.checked).map(x => Number(x.dataset.day)); save(); });
  });
  $$('[data-up]').forEach(b => b.onclick = () => { const i = Number(b.dataset.up); [S.slots[i - 1], S.slots[i]] = [S.slots[i], S.slots[i - 1]]; save(); renderSet(); });
  $$('[data-rm]').forEach(b => b.onclick = () => {
    const s = S.slots[b.dataset.rm]; const used = Object.values(S.months).some(m => Object.keys(m.grid).some(k => k.endsWith('|' + s.id)));
    const sh = openSheet(`<h3>להסיר את ${esc(slotLabel(s))}?</h3><p class="sub">${used ? 'השיבוצים במשבצת הזו יימחקו מכל החודשים.' : ''}</p><div class="foot"><button class="btn danger" id="go">הסרה</button><button class="btn" data-close>ביטול</button></div>`);
    sh.el.querySelector('#go').onclick = () => { for (const m of Object.values(S.months)) for (const k in m.grid) if (k.endsWith('|' + s.id)) delete m.grid[k]; S.slots = S.slots.filter(x => x !== s); sh.close(); save(); renderSet(); };
  });
  $('#addSlot').onclick = () => { S.slots.push({ id: 'S' + Math.random().toString(36).slice(2, 7), area: 'W', name: 'משבצת חדשה', from: 8, to: 16, opt: true }); save(); renderSet(); };
  $('#resetSlots').onclick = () => { const ids = new Set(DEFAULT_SLOTS.map(s => s.id)); const lost = S.slots.filter(s => !ids.has(s.id)); if (lost.length && !confirm('משבצות שהוספתם יוסרו, כולל השיבוצים בהן. להמשיך?')) return; for (const m of Object.values(S.months)) for (const k in m.grid) if (!ids.has(k.split('|')[1])) delete m.grid[k]; S.slots = DEFAULT_SLOTS.map(s => ({ ...s })); save(); renderSet(); };
  $('#saveDl').onclick = async () => { const v = $('#dl').value; if (v) S.deadlines[S.cur] = v; else delete S.deadlines[S.cur]; save(); toast(apiOn() && await pushConfig() ? 'המועד נשמר ונשלח לטופס' : 'המועד נשמר'); renderSet(); };
  const nd = $('#noDl'); if (nd) nd.onclick = async () => { delete S.deadlines[S.cur]; save(); if (apiOn()) await pushConfig(); renderSet(); };
  $('#cpForm').onclick = () => copyText(formUrl);
  $('#saveApi').onclick = async () => { S.settings.apiUrl = $('#api').value.trim(); S.settings.apiKey = $('#key').value.trim(); lsSet(SKEY, S); await pullState(true); };
  $('#out').onclick = () => { if (!confirm('למחוק את המפתח והנתונים מהדפדפן הזה? הנתונים בשרת לא נמחקים.')) return; try { localStorage.removeItem(SKEY); } catch (e) {} S = blankState(); render(); };
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify({ ...S, settings: { apiUrl: S.settings.apiUrl, apiKey: '' } }, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `גיבוי שיבוץ בכירים ${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); };
  $('#imp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const st = JSON.parse(await f.text()); if (!st.people || !st.months) throw 0; const keep = S.settings, ts = S.ts; S = { ...blankState(), ...st, settings: keep, ts }; save(true); toast('שוחזר'); render(); } catch (err) { toast('הקובץ לא תקין'); } };
}

$$('nav.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.tab; lsSet('sr-admin-tab', TAB); render(); });
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
render();
if (apiOn()) pullState(); else setSync('לא מחובר לשרת', true);
</script>
</body>
</html>
